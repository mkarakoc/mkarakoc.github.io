<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weight Tracker</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js for graphing -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Date adapter for Chart.js to handle time scales -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <!-- Zoom plugin for Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <!-- regression-js for trendlines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/regression/2.0.1/regression.min.js"></script>
    
    <!-- Lucide Icons for UI elements -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Custom font and base styles */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* --- App Layout --- */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .app-header {
            flex-shrink: 0;
        }
        .app-content {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 80px; /* Space for FAB */
        }
        
        /* --- Modal Styles --- */
        .modal {
            transition: opacity 0.25s ease;
        }
        .modal-content {
            transition: transform 0.25s ease;
        }

        /* --- Custom Toast/Alert --- */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translate(-50%, 150%);
            transition: transform 0.5s ease-in-out;
            z-index: 100;
        }
        #toast.show {
            transform: translate(-50%, 0);
        }

        /* --- Tab Navigation --- */
        .tab-content {
            display: none;
            height: 100%;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <div class="app-container">
        <!-- Header -->
        <header class="app-header bg-white shadow-md z-20">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <h1 id="header-title" class="text-xl font-bold text-slate-900">Weight Tracker</h1>
                    <div class="flex items-center gap-2">
                        <!-- Tab Buttons -->
                        <div class="flex items-center gap-1 p-1 bg-slate-100 rounded-lg">
                            <button data-tab="chart-tab" class="tab-btn px-3 py-1 text-sm font-semibold rounded-md bg-white shadow-sm text-indigo-600">Chart</button>
                            <button data-tab="history-tab" class="tab-btn px-3 py-1 text-sm font-semibold rounded-md text-slate-500">History</button>
                        </div>
                        <button id="reset-zoom-btn" class="p-2 rounded-full hover:bg-slate-100 transition text-slate-600">
                            <i data-lucide="zoom-out" class="w-5 h-5"></i>
                        </button>
                        <button id="menu-btn" class="p-2 rounded-full hover:bg-slate-100 transition text-slate-600">
                            <i data-lucide="more-vertical" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content (Swappable Tabs) -->
        <main class="app-content">
            <!-- Chart Tab -->
            <div id="chart-tab" class="tab-content active h-full p-4">
                <section class="bg-white p-4 rounded-xl shadow-lg h-full flex flex-col">
                    <div class="relative flex-grow">
                        <canvas id="weightChart"></canvas>
                    </div>
                </section>
            </div>

            <!-- History Tab -->
            <div id="history-tab" class="tab-content p-4">
                <div id="history-list" class="space-y-3">
                    <!-- History cards will be inserted here -->
                </div>
            </div>
        </main>

        <!-- Floating Action Button (FAB) -->
        <button id="fab-add-btn" class="fixed bottom-6 right-6 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full p-4 shadow-lg transition-transform transform hover:scale-110 z-30">
            <i data-lucide="plus" class="w-6 h-6"></i>
        </button>
    </div>

    <!-- Add/Edit Entry Modal -->
    <div id="entry-modal" class="modal fixed inset-0 bg-black bg-opacity-40 z-50 hidden items-center justify-center p-4 opacity-0">
        <div id="entry-modal-content" class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-sm transform scale-95">
            <div class="p-6">
                <h3 id="entry-modal-title" class="text-lg font-bold text-slate-800 mb-4">Add New Entry</h3>
                <div class="space-y-4">
                    <div>
                        <label for="entry-date" class="block text-sm font-medium text-slate-600 mb-1">Date</label>
                        <input type="date" id="entry-date" class="w-full p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label for="entry-weight" class="block text-sm font-medium text-slate-600 mb-1">Weight (kg)</label>
                        <input type="number" id="entry-weight" step="0.1" placeholder="0.0" class="w-full p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
            </div>
            <div class="bg-slate-50 px-6 py-3 flex justify-end gap-3 rounded-b-xl">
                <button id="entry-modal-cancel" class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-200 font-semibold transition">Cancel</button>
                <button id="entry-modal-save" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition">Save</button>
            </div>
        </div>
    </div>

    <!-- Menu Modal -->
    <div id="menu-modal" class="modal fixed inset-0 bg-black bg-opacity-40 z-50 hidden items-end justify-center p-4 opacity-0">
        <div id="menu-modal-content" class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-md transform translate-y-full">
            <div class="p-2">
                <button id="importButton" class="w-full flex items-center gap-4 px-4 py-3 text-left text-slate-700 hover:bg-slate-100 rounded-lg transition">
                    <i data-lucide="upload-cloud" class="w-5 h-5 text-emerald-600"></i>
                    <span class="font-semibold">Import from CSV</span>
                </button>
                <button id="exportButton" class="w-full flex items-center gap-4 px-4 py-3 text-left text-slate-700 hover:bg-slate-100 rounded-lg transition">
                    <i data-lucide="download-cloud" class="w-5 h-5 text-slate-500"></i>
                    <span class="font-semibold">Export to CSV</span>
                </button>
            </div>
            <div class="p-2 border-t border-slate-200">
                 <button id="menu-modal-close" class="w-full flex items-center justify-center gap-4 px-4 py-3 text-left text-slate-700 hover:bg-slate-100 rounded-lg transition font-bold">
                    Cancel
                </button>
            </div>
        </div>
    </div>
    
    <!-- Hidden file input -->
    <input type="file" id="csvFileInput" class="hidden" accept=".csv">

    <!-- Custom Toast Notification -->
    <div id="toast" class="py-3 px-5 rounded-lg shadow-lg text-white font-semibold">
        <span id="toast-message"></span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Element Selectors ---
            const importButton = document.getElementById('importButton');
            const exportButton = document.getElementById('exportButton');
            const fabAddBtn = document.getElementById('fab-add-btn');
            const csvFileInput = document.getElementById('csvFileInput');
            const historyList = document.getElementById('history-list');
            const ctx = document.getElementById('weightChart').getContext('2d');
            const resetZoomBtn = document.getElementById('reset-zoom-btn');
            const menuBtn = document.getElementById('menu-btn');
            const menuModal = document.getElementById('menu-modal');
            const menuModalContent = document.getElementById('menu-modal-content');
            const menuModalClose = document.getElementById('menu-modal-close');
            const entryModal = document.getElementById('entry-modal');
            const entryModalContent = document.getElementById('entry-modal-content');
            const entryModalTitle = document.getElementById('entry-modal-title');
            const entryModalCancel = document.getElementById('entry-modal-cancel');
            const entryModalSave = document.getElementById('entry-modal-save');
            const entryDate = document.getElementById('entry-date');
            const entryWeight = document.getElementById('entry-weight');
            const headerTitle = document.getElementById('header-title');
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            let weightChart;
            let currentEditDate = null;
            
            // --- Initialize UI Components ---
            lucide.createIcons();

            // --- Custom Toast Notification (Self-contained) ---
            const showToast = (() => {
                let toastTimer;
                return (message, type = 'success', duration = 3000) => {
                    const toast = document.getElementById('toast');
                    const toastMessage = document.getElementById('toast-message');
                    if (!toast || !toastMessage) return;

                    clearTimeout(toastTimer);

                    toastMessage.textContent = message;
                    toast.className = 'py-3 px-5 rounded-lg shadow-lg text-white font-semibold';
                    const typeClasses = { success: 'bg-emerald-500', error: 'bg-red-500', info: 'bg-slate-700' };
                    toast.classList.add(typeClasses[type] || typeClasses.info);
                    
                    toast.classList.add('show');
                    
                    toastTimer = setTimeout(() => {
                        toast.classList.remove('show');
                    }, duration);
                };
            })();


            // --- Event Listeners ---
            importButton.addEventListener('click', () => { csvFileInput.click(); closeMenuModal(); });
            csvFileInput.addEventListener('change', handleFileUpload);
            exportButton.addEventListener('click', () => { exportDataToCSV(); closeMenuModal(); });
            fabAddBtn.addEventListener('click', openAddModal);
            resetZoomBtn.addEventListener('click', () => { if (weightChart) weightChart.resetZoom(); });
            menuBtn.addEventListener('click', openMenuModal);
            menuModalClose.addEventListener('click', closeMenuModal);
            menuModal.addEventListener('click', (e) => { if(e.target === menuModal) closeMenuModal(); });
            entryModalCancel.addEventListener('click', closeEntryModal);
            entryModalSave.addEventListener('click', saveEntry);
            tabButtons.forEach(button => button.addEventListener('click', switchTab));

            // --- Tab Navigation ---
            function switchTab(event) {
                const tabId = event.currentTarget.dataset.tab;
                
                tabContents.forEach(content => {
                    content.classList.toggle('active', content.id === tabId);
                });

                tabButtons.forEach(button => {
                    const isSelected = button.dataset.tab === tabId;
                    button.classList.toggle('bg-white', isSelected);
                    button.classList.toggle('shadow-sm', isSelected);
                    button.classList.toggle('text-indigo-600', isSelected);
                    button.classList.toggle('text-slate-500', !isSelected);
                });
            }

            // --- Modal Logic ---
            function openMenuModal() {
                menuModal.classList.remove('hidden');
                setTimeout(() => {
                    menuModal.classList.remove('opacity-0');
                    menuModalContent.classList.remove('translate-y-full');
                }, 10);
            }
            function closeMenuModal() {
                menuModal.classList.add('opacity-0');
                menuModalContent.classList.add('translate-y-full');
                setTimeout(() => { menuModal.classList.add('hidden'); }, 250);
            }
            function openAddModal() {
                currentEditDate = null;
                entryModalTitle.textContent = 'Add New Entry';
                entryDate.value = new Date().toISOString().split('T')[0];
                entryWeight.value = '';
                entryDate.disabled = false;
                openEntryModal();
            }
            function openEditModal(date, weight) {
                currentEditDate = date;
                entryModalTitle.textContent = 'Edit Entry';
                entryDate.value = date;
                entryWeight.value = weight;
                entryDate.disabled = true;
                openEntryModal();
            }
            function openEntryModal() {
                entryModal.classList.remove('hidden');
                setTimeout(() => {
                    entryModal.classList.remove('opacity-0');
                    entryModalContent.classList.remove('scale-95');
                    entryWeight.focus();
                }, 10);
            }
            function closeEntryModal() {
                entryModal.classList.add('opacity-0');
                entryModalContent.classList.add('scale-95');
                setTimeout(() => { entryModal.classList.add('hidden'); }, 250);
            }

            // --- Core App Functions ---
            function initializeChart() {
                weightChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: [] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { 
                                type: 'time', 
                                position: 'bottom',
                                time: {
                                    unit: 'day',
                                    tooltipFormat: 'MMM d, yyyy', 
                                    displayFormats: { day: 'MMM d' }
                                },
                                grid: { color: '#e2e8f0' } 
                            },
                            y: { 
                                position: 'left',
                                title: { display: true, text: 'Weight (kg)' }, 
                                grid: { color: '#e2e8f0' } 
                            }
                        },
                        plugins: {
                            legend: { 
                                display: true,
                                position: 'top',
                                align: 'start',
                                onClick: (e, legendItem, legend) => {
                                    const index = legendItem.datasetIndex;
                                    const ci = legend.chart;
                                    const meta = ci.getDatasetMeta(index);
                                    
                                    meta.hidden = meta.hidden === null ? !ci.data.datasets[index].hidden : null;

                                    if (legendItem.text === 'Daily Trend') {
                                        ci.getDatasetMeta(2).hidden = meta.hidden;
                                    } else if (legendItem.text === 'Weekly Average') {
                                        ci.getDatasetMeta(4).hidden = meta.hidden;
                                    } else if (legendItem.text === 'Weekly Trend') {
                                        ci.getDatasetMeta(6).hidden = meta.hidden;
                                    }
                                    
                                    ci.update();
                                },
                                labels: {
                                    sort: (a, b) => {
                                        const legendOrder = ['Daily Weight', 'Weekly Average', 'Daily Trend', 'Weekly Trend'];
                                        return legendOrder.indexOf(a.text) - legendOrder.indexOf(b.text);
                                    },
                                    filter: (item) => !['Daily Future Trend', 'Weekly Std Dev', 'Weekly Future Trend'].includes(item.text)
                                }
                             },
                            tooltip: { 
                                enabled: true, mode: 'nearest', intersect: true, position: 'nearest', caretPadding: 10, displayColors: false,
                                callbacks: {
                                    title: (items) => new Date(items[0].parsed.x).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
                                    label: (item) => `${item.dataset.label || ''}: ${item.parsed.y.toFixed(1)} kg`
                                }
                            },
                            zoom: {
                                zoom: { drag: { enabled: true }, mode: 'xy' },
                                pan: { enabled: true, mode: 'xy' }
                            }
                        },
                        interaction: { mode: 'nearest', axis: 'x', intersect: true }
                    }
                });
            }

            function updateApp() {
                const data = getData();
                renderHistoryList(data);
                plotGraph(data);
            }

            function renderHistoryList(data) {
                historyList.innerHTML = '';
                if (data.length === 0) {
                    historyList.innerHTML = `<div class="text-center p-10 text-slate-500">
                        <i data-lucide="clipboard-list" class="w-12 h-12 mx-auto mb-2"></i>
                        <p>No data yet.</p>
                        <p>Tap the '+' button to add your first entry.</p>
                    </div>`;
                    lucide.createIcons();
                    return;
                }
                data.slice().reverse().forEach(item => { // Show newest first
                    const card = document.createElement('div');
                    card.className = 'bg-white p-4 rounded-lg shadow-sm flex items-center justify-between';
                    const date = new Date(item.date + 'T00:00:00'); // Ensure local timezone
                    const formattedDate = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

                    card.innerHTML = `
                        <div>
                            <p class="font-semibold text-slate-800">${item.mass.toFixed(1)} kg</p>
                            <p class="text-sm text-slate-500">${formattedDate}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button class="edit-btn p-2 rounded-full hover:bg-slate-100 text-slate-500" data-date="${item.date}" data-weight="${item.mass}">
                                <i data-lucide="edit-2" class="w-4 h-4"></i>
                            </button>
                            <button class="delete-btn p-2 rounded-full hover:bg-red-100 text-red-500" data-date="${item.date}">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    historyList.appendChild(card);
                });
                lucide.createIcons();
                historyList.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => {
                    const { date, weight } = e.currentTarget.dataset;
                    openEditModal(date, weight);
                }));
                historyList.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', (e) => {
                    const dateToDelete = e.currentTarget.dataset.date;
                    let data = getData();
                    data = data.filter(d => d.date !== dateToDelete);
                    setData(data);
                    showToast('Entry deleted!');
                    updateApp();
                }));
            }
            
            function saveEntry() {
                const date = entryDate.value;
                const weight = parseFloat(entryWeight.value);

                if (!date || isNaN(weight)) {
                    showToast('Please enter a valid date and weight.', 'error');
                    return;
                }

                let data = getData();
                if (currentEditDate) { // Editing existing
                    const index = data.findIndex(d => d.date === currentEditDate);
                    if (index > -1) {
                        data[index].mass = weight;
                    }
                } else { // Adding new
                    // Check for duplicate date
                    if (data.some(d => d.date === date)) {
                        showToast('An entry for this date already exists.', 'error');
                        return;
                    }
                    data.push({ date, mass: weight });
                }
                
                setData(data);
                showToast('Entry saved!');
                updateApp();
                closeEntryModal();
            }

            // --- Local Storage Functions ---
            function getData() {
                try {
                    const data = localStorage.getItem('weightData');
                    return data ? JSON.parse(data).sort((a, b) => new Date(a.date) - new Date(b.date)) : [];
                } catch (e) {
                    console.error("Failed to parse data from localStorage", e);
                    return [];
                }
            }

            function setData(data) {
                localStorage.setItem('weightData', JSON.stringify(data));
            }

            // --- CSV Handling ---
            function handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = parseCSV(e.target.result);
                        if (importedData.length === 0) {
                            showToast("Could not find valid data. Ensure format is 'YYYY-MM-DD,weight'.", 'error'); return;
                        }
                        const dataMap = new Map(getData().map(d => [d.date, d.mass]));
                        importedData.forEach(d => dataMap.set(d.date, d.mass));
                        const mergedData = Array.from(dataMap, ([date, mass]) => ({ date, mass }));
                        setData(mergedData);
                        showToast(`Successfully imported and merged ${importedData.length} records.`, 'success');
                        updateApp();
                    } catch (error) {
                        showToast("An error occurred while parsing the file.", 'error'); 
                        console.error("CSV Parse Error:", error);
                    }
                };
                reader.readAsText(file);
                csvFileInput.value = '';
            }

            function parseCSV(text) {
                const data = [];
                const lines = text.split(/\r\n|\n/);
                const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
                lines.forEach(line => {
                    const parts = line.split(',');
                    if (parts.length === 2) {
                        const date = parts[0].trim();
                        const mass = parseFloat(parts[1].trim());
                        if (dateRegex.test(date) && !isNaN(mass)) data.push({ date, mass });
                    }
                });
                return data;
            }

            function exportDataToCSV() {
                const data = getData();
                if (data.length === 0) { showToast("No data to export.", 'error'); return; }
                let csvContent = "date,mass\n";
                data.forEach(row => { csvContent += `${row.date},${row.mass}\n`; });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "weight_data_export.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // --- Calculation Helper ---
            function calculateStandardDeviation(array) {
                if (array.length < 2) return 0;
                const n = array.length;
                const mean = array.reduce((a, b) => a + b) / n;
                const variance = array.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1);
                return Math.sqrt(variance);
            }

            // --- Graph Plotting ---
            function plotGraph(data) {
                if (!weightChart) initializeChart();

                if (!data || data.length < 2) {
                    weightChart.data.labels = [];
                    weightChart.data.datasets = [];
                    if (!weightChart.options.plugins.title) weightChart.options.plugins.title = {};
                    weightChart.options.plugins.title = {
                        display: true,
                        text: 'Enter at least two data points to see the graph.',
                        color: '#64748b',
                        font: { size: 16 }
                    };
                    weightChart.update();
                    return;
                }
                
                if (weightChart.options.plugins.title) weightChart.options.plugins.title.display = false;
                
                const startDate = new Date(data[0].date);

                function getDateStringFromDays(days) {
                    const newDate = new Date(startDate);
                    newDate.setDate(newDate.getDate() + days);
                    return newDate.toISOString().split('T')[0];
                }

                const plotData = data.map(d => ({ x: d.date, y: d.mass }));

                const numericalData = data.map(d => ({ 
                    days: Math.round((new Date(d.date) - startDate) / (1000 * 60 * 60 * 24)), 
                    mass: d.mass 
                }));
                
                const days = numericalData.map(d => d.days);
                const regressionPoints = numericalData.map(d => [d.days, d.mass]);
                const linFit = regression.linear(regressionPoints);

                const lastDayOfData = days.length > 0 ? Math.max(...days) : 0;
                const futureLimit = lastDayOfData + 30;

                const currentTrendPoints = days.map(day => ({ 
                    x: getDateStringFromDays(day), 
                    y: linFit.predict(day)[1] 
                }));
                
                const lastTrendPoint = { 
                    x: getDateStringFromDays(lastDayOfData), 
                    y: linFit.predict(lastDayOfData)[1] 
                };

                const futureTrendPoints = [lastTrendPoint];
                for (let i = lastDayOfData + 1; i <= futureLimit; i++) {
                    futureTrendPoints.push({ x: getDateStringFromDays(i), y: linFit.predict(i)[1] });
                }

                // --- Weekly Average & Stdev Logic ---
                const weeklyData = {};
                numericalData.forEach(d => {
                    const weekIndex = Math.floor(d.days / 7);
                    if (!weeklyData[weekIndex]) {
                        weeklyData[weekIndex] = { days: [], masses: [] };
                    }
                    weeklyData[weekIndex].days.push(d.days);
                    weeklyData[weekIndex].masses.push(d.mass);
                });

                const weeklyAveragePoints = [];
                const weeklyErrorBars = [];
                const weeklyRegressionPoints = [];
                Object.keys(weeklyData).forEach(weekIndexStr => {
                    const weekIndex = parseInt(weekIndexStr);
                    const week = weeklyData[weekIndex];
                    if (week.masses.length === 0) return;
                    
                    const avgMass = week.masses.reduce((a, b) => a + b, 0) / week.masses.length;
                    const stdDev = calculateStandardDeviation(week.masses);
                    
                    const lastDayOfWeek = (weekIndex * 7) + 6;
                    const lastDateStr = getDateStringFromDays(lastDayOfWeek);

                    weeklyAveragePoints.push({ x: lastDateStr, y: avgMass });
                    weeklyErrorBars.push({ x: lastDateStr, y: [avgMass - stdDev, avgMass + stdDev] });
                    weeklyRegressionPoints.push([lastDayOfWeek, avgMass]);
                });
                // --- End Weekly Logic ---

                // --- Weekly Trend Calculation ---
                const weeklyLinFit = regression.linear(weeklyRegressionPoints);
                const weeklyCurrentTrendPoints = days.map(day => ({
                    x: getDateStringFromDays(day),
                    y: weeklyLinFit.predict(day)[1]
                }));
                const weeklyLastTrendPoint = {
                    x: getDateStringFromDays(lastDayOfData),
                    y: weeklyLinFit.predict(lastDayOfData)[1]
                };
                const weeklyFutureTrendPoints = [weeklyLastTrendPoint];
                for (let i = lastDayOfData + 1; i <= futureLimit; i++) {
                    weeklyFutureTrendPoints.push({ x: getDateStringFromDays(i), y: weeklyLinFit.predict(i)[1] });
                }
                // --- End Weekly Trend Calculation ---

                weightChart.data.labels = [];
                weightChart.data.datasets = [
                    {
                        label: 'Daily Weight',
                        data: plotData,
                        borderColor: 'rgba(0, 0, 0, 0.3)',
                        backgroundColor: 'rgba(0, 0, 0, 0.3)',
                        pointBackgroundColor: 'rgba(0, 0, 0, 0.3)',
                        borderWidth: 1,
                        borderDash: [5, 5],
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        type: 'line',
                        order: 5
                    },
                    {
                        label: 'Daily Trend',
                        data: currentTrendPoints,
                        borderColor: 'rgba(217, 70, 239, 1)', // Magenta
                        backgroundColor: 'rgba(217, 70, 239, 1)', // Magenta
                        borderWidth: 2.5,
                        pointRadius: 0,
                        type: 'line',
                        order: 0
                    },
                    {
                        label: 'Daily Future Trend',
                        data: futureTrendPoints,
                        borderColor: 'rgba(217, 70, 239, 1)', // Magenta
                        backgroundColor: 'rgba(217, 70, 239, 1)', // Magenta
                        borderWidth: 2.5,
                        pointRadius: 0,
                        borderDash: [5, 5],
                        type: 'line',
                        order: 1
                    },
                    {
                        label: 'Weekly Average',
                        data: weeklyAveragePoints,
                        backgroundColor: 'rgba(255, 0, 0, 0.5)',
                        borderColor: 'rgba(255, 0, 0, 0.5)',
                        borderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        type: 'scatter',
                        order: 3,
                    },
                    {
                        label: 'Weekly Std Dev',
                        data: weeklyErrorBars,
                        backgroundColor: 'rgba(255, 0, 0, 0.5)',
                        borderColor: 'rgba(255, 0, 0, 0.5)',
                        borderWidth: { top: 3, bottom: 3, left: 0, right: 0 },
                        borderSkipped: false,
                        barPercentage: 0.2,
                        type: 'bar',
                        order: 4,
                    },
                    {
                        label: 'Weekly Trend',
                        data: weeklyCurrentTrendPoints,
                        backgroundColor: 'rgba(59, 130, 246, 1)', // Blue
                        borderColor: 'rgba(59, 130, 246, 1)', // Blue
                        borderWidth: 2.5,
                        pointRadius: 0,
                        type: 'line',
                        order: 2
                    },
                    {
                        label: 'Weekly Future Trend',
                        data: weeklyFutureTrendPoints,
                        borderColor: 'rgba(59, 130, 246, 1)', // Blue
                        borderWidth: 2.5,
                        pointRadius: 0,
                        borderDash: [5, 5],
                        type: 'line',
                        order: 2
                    }
                ];
                
                weightChart.options.scales.x.max = getDateStringFromDays(futureLimit);
                weightChart.update();
            }

            // --- Initial Load ---
            initializeChart();
            updateApp();
        });
    </script>
</body>
</html>
