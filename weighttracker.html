<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weight Tracker</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js for graphing -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Date adapter for Chart.js to handle time scales -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <!-- Zoom plugin for Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <!-- regression-js for trendlines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/regression/2.0.1/regression.min.js"></script>
    
    <!-- Lucide Icons for UI elements -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Custom font and base styles */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* --- App Layout --- */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .app-header {
            flex-shrink: 0;
        }
        .app-content {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 80px; /* Space for FAB */
        }
        
        /* --- Modal Styles --- */
        .modal {
            transition: opacity 0.25s ease;
        }
        .modal-content {
            transition: transform 0.25s ease;
        }

        /* --- Custom Toast/Alert --- */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translate(-50%, 150%);
            transition: transform 0.5s ease-in-out;
            z-index: 100;
        }
        #toast.show {
            transform: translate(-50%, 0);
        }

        /* --- Tab Navigation --- */
        .tab-content {
            display: none;
            height: 100%;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <div id="loading-overlay" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
        <div class="flex flex-col items-center gap-4">
            <svg class="animate-spin h-8 w-8 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-slate-500">Connecting...</p>
        </div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header bg-white shadow-md z-20">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <h1 id="header-title" class="text-xl font-bold text-slate-900">Weight Tracker</h1>
                    <div class="flex items-center gap-2">
                        <button id="importButton" title="Import from CSV" class="p-2 rounded-full hover:bg-slate-100 transition text-emerald-600">
                            <i data-lucide="upload-cloud" class="w-5 h-5"></i>
                        </button>
                        <button id="exportButton" title="Export to CSV" class="p-2 rounded-full hover:bg-slate-100 transition text-slate-500">
                            <i data-lucide="download-cloud" class="w-5 h-5"></i>
                        </button>
                        <!-- Tab Buttons -->
                        <div class="flex items-center gap-1 p-1 bg-slate-100 rounded-lg">
                            <button data-tab="chart-tab" class="tab-btn px-3 py-1 text-sm font-semibold rounded-md bg-white shadow-sm text-indigo-600">Chart</button>
                            <button data-tab="history-tab" class="tab-btn px-3 py-1 text-sm font-semibold rounded-md text-slate-500">History</button>
                        </div>
                        <button id="reset-zoom-btn" class="p-2 rounded-full hover:bg-slate-100 transition text-slate-600">
                            <i data-lucide="zoom-out" class="w-5 h-5"></i>
                        </button>
                        <!-- New Input Box for Future Trend -->
                        <div id="future-controls" class="items-center gap-1 sm:flex">
                            <input type="number" id="future-days-input" value="30" min="1" max="365" class="w-14 text-center p-1 text-sm rounded-md border border-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <label for="future-days-input" class="text-sm font-medium text-slate-500">day trend</label>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content (Swappable Tabs) -->
        <main class="app-content">
            <!-- Chart Tab -->
            <div id="chart-tab" class="tab-content active h-full p-4">
                <section class="bg-white p-4 rounded-xl shadow-lg h-full flex flex-col">
                    <div class="relative flex-grow">
                        <canvas id="weightChart"></canvas>
                    </div>
                </section>
            </div>

            <!-- History Tab -->
            <div id="history-tab" class="tab-content p-4">
                <div id="history-list" class="space-y-3">
                    <!-- History cards will be inserted here -->
                </div>
            </div>
        </main>

        <!-- Floating Action Button (FAB) -->
        <button id="fab-add-btn" class="fixed bottom-6 right-6 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full p-4 shadow-lg transition-transform transform hover:scale-110 z-30">
            <i data-lucide="plus" class="w-6 h-6"></i>
        </button>
    </div>

    <!-- Add/Edit Entry Modal -->
    <div id="entry-modal" class="modal fixed inset-0 bg-black bg-opacity-40 z-50 hidden items-center justify-center p-4 opacity-0">
        <div id="entry-modal-content" class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-sm transform scale-95">
            <div class="p-6">
                <h3 id="entry-modal-title" class="text-lg font-bold text-slate-800 mb-4">Add New Entry</h3>
                <div class="space-y-4">
                    <div>
                        <label for="entry-date" class="block text-sm font-medium text-slate-600 mb-1">Date</label>
                        <input type="date" id="entry-date" class="w-full p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label for="entry-weight" class="block text-sm font-medium text-slate-600 mb-1">Weight (kg)</label>
                        <input type="number" id="entry-weight" step="0.1" placeholder="0.0" class="w-full p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
            </div>
            <div class="bg-slate-50 px-6 py-3 flex justify-end gap-3 rounded-b-xl">
                <button id="entry-modal-cancel" class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-200 font-semibold transition">Cancel</button>
                <button id="entry-modal-save" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition">Save</button>
            </div>
        </div>
    </div>
    
    <!-- Hidden file input -->
    <input type="file" id="csvFileInput" class="hidden" accept=".csv">

    <!-- Custom Toast Notification -->
    <div id="toast" class="py-3 px-5 rounded-lg shadow-lg text-white font-semibold">
        <span id="toast-message"></span>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, addDoc, deleteDoc, onSnapshot, collection, query, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        document.addEventListener('DOMContentLoaded', () => {
            // --- Element Selectors ---
            const importButton = document.getElementById('importButton');
            const exportButton = document.getElementById('exportButton');
            const fabAddBtn = document.getElementById('fab-add-btn');
            const csvFileInput = document.getElementById('csvFileInput');
            const historyList = document.getElementById('history-list');
            const ctx = document.getElementById('weightChart').getContext('2d');
            const resetZoomBtn = document.getElementById('reset-zoom-btn');
            const entryModal = document.getElementById('entry-modal');
            const entryModalContent = document.getElementById('entry-modal-content');
            const entryModalTitle = document.getElementById('entry-modal-title');
            const entryModalCancel = document.getElementById('entry-modal-cancel');
            const entryModalSave = document.getElementById('entry-modal-save');
            const entryDate = document.getElementById('entry-date');
            const entryWeight = document.getElementById('entry-weight');
            const headerTitle = document.getElementById('header-title');
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            const loadingOverlay = document.getElementById('loading-overlay');
            const futureDaysInput = document.getElementById('future-days-input');
            const futureControls = document.getElementById('future-controls');

            let weightChart;
            let currentEditId = null; // Use Firestore document ID for editing
            let localWeightData = []; // Local cache of Firestore data
            let unsubscribe; // To detach Firestore listener

            // --- Firebase Initialization ---
            let db, auth, userId, appId;

            async function initializeFirebase() {
                try {
                    // These are placeholders that will be replaced by the environment
                    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
                    appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

                    if (!firebaseConfig.apiKey) {
                        console.error("Firebase config is missing.");
                        loadingOverlay.textContent = "Error: Firebase configuration is missing.";
                        return;
                    }
                    
                    setLogLevel('debug');
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            userId = user.uid;
                            console.log("User is signed in with UID:", userId);
                            setupDataListener();
                        } else {
                            console.log("User is not signed in. Attempting to sign in...");
                            try {
                                if (typeof __initial_auth_token !== 'undefined') {
                                    await signInWithCustomToken(auth, __initial_auth_token);
                                } else {
                                    await signInAnonymously(auth);
                                }
                            } catch (error) {
                                console.error("Error signing in:", error);
                                loadingOverlay.textContent = "Authentication failed.";
                            }
                        }
                    });

                } catch (error) {
                    console.error("Firebase initialization failed:", error);
                    loadingOverlay.textContent = "Could not initialize the application.";
                }
            }
            
            // --- Data Listener ---
            function setupDataListener() {
                if (unsubscribe) unsubscribe(); // Detach any old listener

                const weightsCollectionRef = collection(db, `artifacts/${appId}/users/${userId}/weights`);
                const q = query(weightsCollectionRef);

                unsubscribe = onSnapshot(q, (querySnapshot) => {
                    const data = querySnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    })).sort((a, b) => new Date(a.date) - new Date(b.date));
                    
                    localWeightData = data;
                    updateApp(localWeightData);
                    loadingOverlay.style.display = 'none'; // Hide loading once data is loaded
                }, (error) => {
                    console.error("Error fetching data from Firestore:", error);
                    showToast("Could not load data.", "error");
                    loadingOverlay.style.display = 'none';
                });
            }


            // --- Initialize UI Components ---
            lucide.createIcons();

            // --- Custom Toast Notification (Self-contained) ---
            const showToast = (() => {
                let toastTimer;
                return (message, type = 'success', duration = 3000) => {
                    const toast = document.getElementById('toast');
                    const toastMessage = document.getElementById('toast-message');
                    if (!toast || !toastMessage) return;

                    clearTimeout(toastTimer);

                    toastMessage.textContent = message;
                    toast.className = 'py-3 px-5 rounded-lg shadow-lg text-white font-semibold';
                    const typeClasses = { success: 'bg-emerald-500', error: 'bg-red-500', info: 'bg-slate-700' };
                    toast.classList.add(typeClasses[type] || typeClasses.info);
                    
                    toast.classList.add('show');
                    
                    toastTimer = setTimeout(() => {
                        toast.classList.remove('show');
                    }, duration);
                };
            })();


            // --- Event Listeners ---
            importButton.addEventListener('click', () => { csvFileInput.click(); });
            csvFileInput.addEventListener('change', handleFileUpload);
            exportButton.addEventListener('click', () => { exportDataToCSV(); });
            fabAddBtn.addEventListener('click', openAddModal);
            resetZoomBtn.addEventListener('click', () => { if (weightChart) weightChart.resetZoom(); });
            entryModalCancel.addEventListener('click', closeEntryModal);
            entryModalSave.addEventListener('click', saveEntry);
            tabButtons.forEach(button => button.addEventListener('click', switchTab));
            futureDaysInput.addEventListener('input', () => {
                if (localWeightData.length > 1) {
                    plotGraph(localWeightData);
                }
            });

            // --- Tab Navigation ---
            function switchTab(event) {
                const tabId = event.currentTarget.dataset.tab;
                
                tabContents.forEach(content => {
                    content.classList.toggle('active', content.id === tabId);
                });

                tabButtons.forEach(button => {
                    const isSelected = button.dataset.tab === tabId;
                    button.classList.toggle('bg-white', isSelected);
                    button.classList.toggle('shadow-sm', isSelected);
                    button.classList.toggle('text-indigo-600', isSelected);
                    button.classList.toggle('text-slate-500', !isSelected);
                });

                // Show/hide future trend controls based on the active tab
                if (tabId === 'chart-tab') {
                    futureControls.classList.remove('hidden');
                    futureControls.classList.add('sm:flex');
                } else {
                    futureControls.classList.add('hidden');
                    futureControls.classList.remove('sm:flex');
                }
            }

            // --- Modal Logic ---
            function openAddModal() {
                currentEditId = null;
                entryModalTitle.textContent = 'Add New Entry';
                entryDate.value = new Date().toISOString().split('T')[0];
                entryWeight.value = '';
                entryDate.disabled = false;
                openEntryModal();
            }
            function openEditModal(id, date, weight) {
                currentEditId = id;
                entryModalTitle.textContent = 'Edit Entry';
                entryDate.value = date;
                entryWeight.value = weight;
                entryDate.disabled = true;
                openEntryModal();
            }
            function openEntryModal() {
                entryModal.classList.remove('hidden');
                setTimeout(() => {
                    entryModal.classList.remove('opacity-0');
                    entryModalContent.classList.remove('scale-95');
                    entryWeight.focus();
                }, 10);
            }
            function closeEntryModal() {
                entryModal.classList.add('opacity-0');
                entryModalContent.classList.add('scale-95');
                setTimeout(() => { entryModal.classList.add('hidden'); }, 250);
            }

            // --- Core App Functions ---
            function initializeChart() {
                weightChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: [] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { 
                                type: 'time', 
                                position: 'bottom',
                                time: {
                                    unit: 'day',
                                    tooltipFormat: 'MMM d, yyyy', 
                                    displayFormats: { day: 'MMM d' }
                                },
                                grid: { color: '#e2e8f0' } 
                            },
                            y: { 
                                position: 'left',
                                title: { display: true, text: 'Weight (kg)' }, 
                                grid: { color: '#e2e8f0' } 
                            }
                        },
                        plugins: {
                            legend: { 
                                display: true,
                                position: 'top',
                                align: 'start',
                                onClick: (e, legendItem, legend) => {
                                    const index = legendItem.datasetIndex;
                                    const ci = legend.chart;
                                    const meta = ci.getDatasetMeta(index);
                                    
                                    meta.hidden = meta.hidden === null ? !ci.data.datasets[index].hidden : null;

                                    if (legendItem.text === 'Daily Trend') {
                                        ci.getDatasetMeta(2).hidden = meta.hidden;
                                    } else if (legendItem.text === 'Weekly Average') {
                                        ci.getDatasetMeta(4).hidden = meta.hidden;
                                    } else if (legendItem.text === 'Weekly Trend') {
                                        ci.getDatasetMeta(6).hidden = meta.hidden;
                                    }
                                    
                                    ci.update();
                                },
                                labels: {
                                    sort: (a, b) => {
                                        const legendOrder = ['Daily Weight', 'Weekly Average', 'Daily Trend', 'Weekly Trend'];
                                        return legendOrder.indexOf(a.text) - legendOrder.indexOf(b.text);
                                    },
                                    filter: (item) => !['Daily Future Trend', 'Weekly Std Dev', 'Weekly Future Trend'].includes(item.text)
                                }
                             },
                            tooltip: { 
                                enabled: true, mode: 'nearest', intersect: true, position: 'nearest', caretPadding: 10, displayColors: false,
                                callbacks: {
                                    title: (items) => new Date(items[0].parsed.x).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
                                    label: (item) => `${item.dataset.label || ''}: ${item.parsed.y.toFixed(1)} kg`
                                }
                            },
                            zoom: {
                                zoom: { drag: { enabled: true }, mode: 'xy' },
                                pan: { enabled: true, mode: 'xy' }
                            }
                        },
                        interaction: { mode: 'nearest', axis: 'x', intersect: true }
                    }
                });
            }

            function updateApp(data) {
                renderHistoryList(data);
                plotGraph(data);
            }

            function renderHistoryList(data) {
                historyList.innerHTML = '';
                if (data.length === 0) {
                    historyList.innerHTML = `<div class="text-center p-10 text-slate-500">
                        <i data-lucide="clipboard-list" class="w-12 h-12 mx-auto mb-2"></i>
                        <p>No data yet.</p>
                        <p>Tap the '+' button to add your first entry.</p>
                    </div>`;
                    lucide.createIcons();
                    return;
                }
                data.slice().reverse().forEach(item => { // Show newest first
                    const card = document.createElement('div');
                    card.className = 'bg-white p-4 rounded-lg shadow-sm flex items-center justify-between';
                    const date = new Date(item.date + 'T00:00:00'); // Ensure local timezone
                    const formattedDate = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

                    card.innerHTML = `
                        <div>
                            <p class="font-semibold text-slate-800">${item.mass.toFixed(1)} kg</p>
                            <p class="text-sm text-slate-500">${formattedDate}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button class="edit-btn p-2 rounded-full hover:bg-slate-100 text-slate-500" data-id="${item.id}" data-date="${item.date}" data-weight="${item.mass}">
                                <i data-lucide="edit-2" class="w-4 h-4"></i>
                            </button>
                            <button class="delete-btn p-2 rounded-full hover:bg-red-100 text-red-500" data-id="${item.id}">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    historyList.appendChild(card);
                });
                lucide.createIcons();
                historyList.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => {
                    const { id, date, weight } = e.currentTarget.dataset;
                    openEditModal(id, date, weight);
                }));
                historyList.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async (e) => {
                    const docIdToDelete = e.currentTarget.dataset.id;
                    try {
                        const docRef = doc(db, `artifacts/${appId}/users/${userId}/weights`, docIdToDelete);
                        await deleteDoc(docRef);
                        showToast('Entry deleted!');
                        // Real-time listener will update the UI automatically
                    } catch (error) {
                        console.error("Error deleting document: ", error);
                        showToast('Failed to delete entry.', 'error');
                    }
                }));
            }
            
            async function saveEntry() {
                const date = entryDate.value;
                const weight = parseFloat(entryWeight.value);

                if (!date || isNaN(weight)) {
                    showToast('Please enter a valid date and weight.', 'error');
                    return;
                }

                try {
                    if (currentEditId) { // Editing existing
                        const docRef = doc(db, `artifacts/${appId}/users/${userId}/weights`, currentEditId);
                        await setDoc(docRef, { date: date, mass: weight });
                    } else { // Adding new
                        // Check for duplicate date
                        if (localWeightData.some(d => d.date === date)) {
                            showToast('An entry for this date already exists.', 'error');
                            return;
                        }
                        const collectionRef = collection(db, `artifacts/${appId}/users/${userId}/weights`);
                        await addDoc(collectionRef, { date: date, mass: weight });
                    }
                    showToast('Entry saved!');
                    closeEntryModal();
                    // Real-time listener updates the UI
                } catch (error) {
                    console.error("Error saving entry: ", error);
                    showToast('Failed to save entry.', 'error');
                }
            }

            // --- CSV Handling ---
            async function handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const importedData = parseCSV(e.target.result);
                        if (importedData.length === 0) {
                            showToast("Could not find valid data. Ensure format is 'YYYY-MM-DD,weight'.", 'error'); return;
                        }
                        
                        // Batch write to Firestore for efficiency
                        const batch = writeBatch(db);
                        const weightsCollectionRef = collection(db, `artifacts/${appId}/users/${userId}/weights`);
                        
                        importedData.forEach(item => {
                            // For simplicity, we'll overwrite duplicates. A more complex merge is possible.
                            // We use the date as a document ID to enforce uniqueness.
                            const docRef = doc(weightsCollectionRef, item.date);
                            batch.set(docRef, { date: item.date, mass: item.mass });
                        });

                        await batch.commit();
                        showToast(`Successfully imported ${importedData.length} records.`, 'success');
                        // Real-time listener will update the UI
                    } catch (error) {
                        showToast("An error occurred while importing the file.", 'error'); 
                        console.error("CSV Import Error:", error);
                    }
                };
                reader.readAsText(file);
                csvFileInput.value = '';
            }

            function parseCSV(text) {
                const data = [];
                const lines = text.split(/\r\n|\n/);
                const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
                lines.forEach(line => {
                    const parts = line.split(',');
                    if (parts.length === 2) {
                        const date = parts[0].trim();
                        const mass = parseFloat(parts[1].trim());
                        if (dateRegex.test(date) && !isNaN(mass)) data.push({ date, mass });
                    }
                });
                return data;
            }

            function exportDataToCSV() {
                const data = localWeightData; // Use the local cache
                if (data.length === 0) { showToast("No data to export.", 'error'); return; }
                let csvContent = "date,mass\n";
                data.forEach(row => { csvContent += `${row.date},${row.mass}\n`; });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "weight_data_export.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // --- Calculation Helper ---
            function calculateStandardDeviation(array) {
                if (array.length < 2) return 0;
                const n = array.length;
                const mean = array.reduce((a, b) => a + b) / n;
                const variance = array.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1);
                return Math.sqrt(variance);
            }

            // --- Graph Plotting ---
            function plotGraph(data) {
                if (!weightChart) initializeChart();

                if (!data || data.length < 2) {
                    weightChart.data.labels = [];
                    weightChart.data.datasets = [];
                    if (!weightChart.options.plugins.title) weightChart.options.plugins.title = {};
                    weightChart.options.plugins.title = {
                        display: true,
                        text: 'Enter at least two data points to see the graph.',
                        color: '#64748b',
                        font: { size: 16 }
                    };
                    weightChart.update();
                    return;
                }
                
                if (weightChart.options.plugins.title) weightChart.options.plugins.title.display = false;
                
                const startDate = new Date(data[0].date);

                function getDateStringFromDays(days) {
                    const newDate = new Date(startDate);
                    newDate.setDate(newDate.getDate() + days);
                    return newDate.toISOString().split('T')[0];
                }

                const plotData = data.map(d => ({ x: d.date, y: d.mass }));

                const numericalData = data.map(d => ({ 
                    days: Math.round((new Date(d.date) - startDate) / (1000 * 60 * 60 * 24)), 
                    mass: d.mass 
                }));
                
                const days = numericalData.map(d => d.days);
                const regressionPoints = numericalData.map(d => [d.days, d.mass]);
                const linFit = regression.linear(regressionPoints);

                const futureDays = parseInt(futureDaysInput.value, 10) || 30;
                const lastDayOfData = days.length > 0 ? Math.max(...days) : 0;
                const futureLimit = lastDayOfData + futureDays;

                const currentTrendPoints = days.map(day => ({ 
                    x: getDateStringFromDays(day), 
                    y: linFit.predict(day)[1] 
                }));
                
                const lastTrendPoint = { 
                    x: getDateStringFromDays(lastDayOfData), 
                    y: linFit.predict(lastDayOfData)[1] 
                };

                const futureTrendPoints = [lastTrendPoint];
                for (let i = lastDayOfData + 1; i <= futureLimit; i++) {
                    futureTrendPoints.push({ x: getDateStringFromDays(i), y: linFit.predict(i)[1] });
                }

                // --- Weekly Average & Stdev Logic ---
                const weeklyData = {};
                numericalData.forEach(d => {
                    const weekIndex = Math.floor(d.days / 7);
                    if (!weeklyData[weekIndex]) {
                        weeklyData[weekIndex] = { days: [], masses: [] };
                    }
                    weeklyData[weekIndex].days.push(d.days);
                    weeklyData[weekIndex].masses.push(d.mass);
                });

                const weeklyAveragePoints = [];
                const weeklyErrorBars = [];
                const weeklyRegressionPoints = [];
                Object.keys(weeklyData).forEach(weekIndexStr => {
                    const weekIndex = parseInt(weekIndexStr);
                    const week = weeklyData[weekIndex];
                    if (week.masses.length === 0) return;
                    
                    const avgMass = week.masses.reduce((a, b) => a + b, 0) / week.masses.length;
                    const stdDev = calculateStandardDeviation(week.masses);
                    
                    const lastDayOfWeek = (weekIndex * 7) + 6;
                    const lastDateStr = getDateStringFromDays(lastDayOfWeek);

                    weeklyAveragePoints.push({ x: lastDateStr, y: avgMass });
                    weeklyErrorBars.push({ x: lastDateStr, y: [avgMass - stdDev, avgMass + stdDev] });
                    weeklyRegressionPoints.push([lastDayOfWeek, avgMass]);
                });
                // --- End Weekly Logic ---

                // --- Weekly Trend Calculation ---
                const weeklyLinFit = regression.linear(weeklyRegressionPoints);
                const weeklyCurrentTrendPoints = days.map(day => ({
                    x: getDateStringFromDays(day),
                    y: weeklyLinFit.predict(day)[1]
                }));
                const weeklyLastTrendPoint = {
                    x: getDateStringFromDays(lastDayOfData),
                    y: weeklyLinFit.predict(lastDayOfData)[1]
                };
                const weeklyFutureTrendPoints = [weeklyLastTrendPoint];
                for (let i = lastDayOfData + 1; i <= futureLimit; i++) {
                    weeklyFutureTrendPoints.push({ x: getDateStringFromDays(i), y: weeklyLinFit.predict(i)[1] });
                }
                // --- End Weekly Trend Calculation ---

                weightChart.data.labels = [];
                weightChart.data.datasets = [
                    {
                        label: 'Daily Weight',
                        data: plotData,
                        borderColor: 'rgba(0, 0, 0, 0.3)',
                        backgroundColor: 'rgba(0, 0, 0, 0.3)',
                        pointBackgroundColor: 'rgba(0, 0, 0, 0.3)',
                        borderWidth: 1,
                        borderDash: [5, 5],
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        type: 'line',
                        order: 5
                    },
                    {
                        label: 'Daily Trend',
                        data: currentTrendPoints,
                        borderColor: 'rgba(217, 70, 239, 1)', // Magenta
                        backgroundColor: 'rgba(217, 70, 239, 1)', // Magenta
                        borderWidth: 2.5,
                        pointRadius: 0,
                        type: 'line',
                        order: 0
                    },
                    {
                        label: 'Daily Future Trend',
                        data: futureTrendPoints,
                        borderColor: 'rgba(217, 70, 239, 1)', // Magenta
                        backgroundColor: 'rgba(217, 70, 239, 1)', // Magenta
                        borderWidth: 2.5,
                        pointRadius: 0,
                        borderDash: [5, 5],
                        type: 'line',
                        order: 1
                    },
                    {
                        label: 'Weekly Average',
                        data: weeklyAveragePoints,
                        backgroundColor: 'rgba(255, 0, 0, 0.5)',
                        borderColor: 'rgba(255, 0, 0, 0.5)',
                        borderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        type: 'scatter',
                        order: 3,
                    },
                    {
                        label: 'Weekly Std Dev',
                        data: weeklyErrorBars,
                        backgroundColor: 'rgba(255, 0, 0, 0.5)',
                        borderColor: 'rgba(255, 0, 0, 0.5)',
                        borderWidth: { top: 3, bottom: 3, left: 0, right: 0 },
                        borderSkipped: false,
                        barPercentage: 0.2,
                        type: 'bar',
                        order: 4,
                    },
                    {
                        label: 'Weekly Trend',
                        data: weeklyCurrentTrendPoints,
                        backgroundColor: 'rgba(59, 130, 246, 1)', // Blue
                        borderColor: 'rgba(59, 130, 246, 1)', // Blue
                        borderWidth: 2.5,
                        pointRadius: 0,
                        type: 'line',
                        order: 2
                    },
                    {
                        label: 'Weekly Future Trend',
                        data: weeklyFutureTrendPoints,
                        borderColor: 'rgba(59, 130, 246, 1)', // Blue
                        borderWidth: 2.5,
                        pointRadius: 0,
                        borderDash: [5, 5],
                        type: 'line',
                        order: 2
                    }
                ];
                
                weightChart.options.scales.x.max = getDateStringFromDays(futureLimit);
                weightChart.update();
            }

            // --- Initial Load ---
            initializeChart();
            initializeFirebase();
        });
    </script>
</body>
