<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Tracker</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js for graphing -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Date adapter for Chart.js to handle time scales -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <!-- Zoom plugin for Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <!-- regression-js for trendlines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/regression/2.0.1/regression.min.js"></script>
    
    <!-- Split.js for draggable panes -->
    <script src="https://unpkg.com/split.js/dist/split.min.js"></script>
    
    <!-- Lucide Icons for UI elements -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Custom font and base styles */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent body scroll */
        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; /* slate-100 */
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; /* slate-300 */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; /* slate-400 */
        }

        /* --- Splitter Styles --- */
        .split-container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 80px); /* Full viewport height minus header */
        }
        .gutter {
            background-color: #f1f5f9; /* slate-100 */
            background-repeat: no-repeat;
            background-position: 50%;
            cursor: col-resize;
            transition: background-color 0.2s ease-in-out;
        }
        .gutter:hover {
            background-color: #e2e8f0; /* slate-200 */
        }
        .gutter.gutter-horizontal {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="30"><path d="M2 0 v30 M5 0 v30 M8 0 v30" stroke="%2394a3b8" stroke-width="1" stroke-linecap="round"/></svg>');
        }

        /* --- Table Styles --- */
        #table-wrapper {
            /* Calculated height to fill the pane */
            height: calc(100% - 90px); 
            overflow-y: auto;
        }
        #dataTable thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* --- Responsive Layout --- */
        @media (max-width: 1024px) {
            .split-container {
                flex-direction: column;
                height: auto;
            }
            #chart-pane, #table-pane {
                width: 100% !important; /* Override Split.js inline styles */
                height: 60vh; /* Give panes substantial height on mobile */
            }
            .gutter.gutter-horizontal {
                 cursor: row-resize;
                 background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="30" height="10"><path d="M0 2 h30 M0 5 h30 M0 8 h30" stroke="%2394a3b8" stroke-width="1" stroke-linecap="round"/></svg>');
            }
        }

        /* --- Custom Toast/Alert --- */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translate(-50%, 150%);
            transition: transform 0.5s ease-in-out;
            z-index: 100;
        }
        #toast.show {
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <div class="flex flex-col h-screen">
        <!-- Header -->
        <header class="text-center py-5 border-b border-slate-200 bg-white shadow-sm">
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Weight Tracker</h1>
            <p class="text-slate-500 mt-1">Visualize your journey and manage your data.</p>
        </header>

        <!-- Main Resizable Layout -->
        <main id="split-container" class="split-container w-full flex-grow p-4 gap-4">
            
            <!-- Left Pane: Chart -->
            <section id="chart-pane" class="bg-white p-6 rounded-xl shadow-lg overflow-hidden flex flex-col">
                <div class="flex flex-wrap items-center justify-between gap-y-2 mb-4">
                    <h2 class="text-xl font-bold text-slate-800">Progress Chart</h2>
                    <div id="chart-controls" class="flex items-center gap-x-4 gap-y-2 text-sm text-slate-600">
                        <div id="chart-toggles" class="flex items-center gap-x-4">
                            <div class="flex items-center">
                                <input type="checkbox" id="toggle-daily" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" checked>
                                <label for="toggle-daily" class="ml-2 cursor-pointer">Daily</label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="toggle-trend" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" checked>
                                <label for="toggle-trend" class="ml-2 cursor-pointer">Trend</label>
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="toggle-weekly" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" checked>
                                <label for="toggle-weekly" class="ml-2 cursor-pointer">Weekly</label>
                            </div>
                        </div>
                        <button id="reset-zoom-btn" class="flex items-center gap-1 text-indigo-600 hover:text-indigo-800 font-semibold transition">
                            <i data-lucide="zoom-out" class="w-4 h-4"></i>
                            Reset Zoom
                        </button>
                    </div>
                </div>
                <div class="relative flex-grow">
                    <canvas id="weightChart"></canvas>
                </div>
            </section>

            <!-- Right Pane: Data Table and Controls -->
            <section id="table-pane" class="bg-white p-6 rounded-xl shadow-lg flex flex-col overflow-hidden">
                <h2 class="text-xl font-bold text-slate-800 mb-4">Weight Data</h2>
                
                <!-- Control Buttons -->
                <div class="flex flex-wrap items-center justify-between gap-2 mb-4 border-b pb-4 border-slate-200">
                    <div class="flex gap-2">
                        <input type="file" id="csvFileInput" class="hidden" accept=".csv">
                        <button type="button" id="importButton" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg shadow-sm transition-transform transform hover:scale-105">
                            <i data-lucide="upload-cloud" class="w-5 h-5"></i> Import
                        </button>
                        <button type="button" id="exportButton" class="flex items-center gap-2 bg-slate-500 hover:bg-slate-600 text-white font-semibold py-2 px-4 rounded-lg shadow-sm transition-transform transform hover:scale-105">
                            <i data-lucide="download-cloud" class="w-5 h-5"></i> Export
                        </button>
                        <button type="button" id="addRowButton" class="flex items-center gap-2 bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2 px-4 rounded-lg shadow-sm transition-transform transform hover:scale-105">
                            <i data-lucide="plus" class="w-5 h-5"></i> Add
                        </button>
                    </div>
                    <button type="button" id="saveButton" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-sm transition-transform transform hover:scale-105">
                        <i data-lucide="save" class="w-5 h-5"></i> Save
                    </button>
                </div>

                <!-- Table Container -->
                <div id="table-wrapper" class="flex-grow">
                    <table id="dataTable" class="w-full text-sm text-left text-slate-500">
                        <thead class="text-xs text-slate-700 uppercase bg-slate-100">
                            <tr>
                                <th scope="col" class="px-4 py-3">Date</th>
                                <th scope="col" class="px-4 py-3">Weight (kg)</th>
                                <th scope="col" class="px-4 py-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data rows will be inserted here by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Custom Toast Notification -->
    <div id="toast" class="py-3 px-5 rounded-lg shadow-lg text-white font-semibold">
        <span id="toast-message"></span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Element Selectors ---
            const saveButton = document.getElementById('saveButton');
            const importButton = document.getElementById('importButton');
            const exportButton = document.getElementById('exportButton');
            const addRowButton = document.getElementById('addRowButton');
            const csvFileInput = document.getElementById('csvFileInput');
            const dataTableBody = document.querySelector("#dataTable tbody");
            const ctx = document.getElementById('weightChart').getContext('2d');
            const resetZoomBtn = document.getElementById('reset-zoom-btn');
            
            let weightChart;

            // --- Initialize UI Components ---
            lucide.createIcons();
            
            // Initialize draggable splitter with responsive behavior
            let split;
            const setupSplitter = () => {
                if (split) {
                    split.destroy();
                }
                const isMobile = window.innerWidth <= 1024;
                split = Split(['#chart-pane', '#table-pane'], {
                    sizes: [60, 40],
                    minSize: isMobile ? 200 : 300,
                    gutterSize: 16,
                    direction: isMobile ? 'vertical' : 'horizontal',
                    cursor: isMobile ? 'row-resize' : 'col-resize',
                    onDrag: () => {
                        if (weightChart) weightChart.resize();
                    }
                });
            };
            
            window.addEventListener('resize', setupSplitter);
            setupSplitter();

            // --- Custom Toast Notification ---
            const showToast = (message, type = 'success', duration = 3000) => {
                const toast = document.getElementById('toast');
                const toastMessage = document.getElementById('toast-message');
                
                toastMessage.textContent = message;
                toast.className = 'py-3 px-5 rounded-lg shadow-lg text-white font-semibold'; // Reset classes
                
                if (type === 'success') {
                    toast.classList.add('bg-emerald-500');
                } else if (type === 'error') {
                    toast.classList.add('bg-red-500');
                } else {
                    toast.classList.add('bg-slate-700');
                }

                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            };

            // --- Event Listeners ---
            saveButton.addEventListener('click', saveTableData);
            importButton.addEventListener('click', () => csvFileInput.click());
            csvFileInput.addEventListener('change', handleFileUpload);
            exportButton.addEventListener('click', exportDataToCSV);
            addRowButton.addEventListener('click', addNewRowToTable);
            resetZoomBtn.addEventListener('click', () => {
                if (weightChart) {
                    weightChart.resetZoom();
                }
            });

            // --- Core App Functions ---
            function initializeChart() {
                weightChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: [] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { 
                                type: 'time', // Use time scale
                                time: {
                                    unit: 'day',
                                    tooltipFormat: 'MMM d, yyyy', // Format for tooltips
                                    displayFormats: {
                                        day: 'MMM d' // Format for axis labels
                                    }
                                },
                                title: { display: true, text: 'Date', font: { weight: '600' } }, 
                                grid: { color: '#e2e8f0' } 
                            },
                            y: { 
                                title: { display: true, text: 'Weight (kg)', font: { weight: '600' } }, 
                                grid: { color: '#e2e8f0' } 
                            }
                        },
                        plugins: {
                            legend: { 
                                position: 'top',
                                labels: {
                                    filter: function(legendItem, chartData) {
                                        // Hide datasets that shouldn't be in the legend
                                        const hiddenLabels = ['Future Trend', 'Weekly Std Dev'];
                                        return !hiddenLabels.includes(legendItem.text);
                                    }
                                }
                             },
                            tooltip: { 
                                enabled: true,
                                mode: 'nearest', 
                                intersect: true,
                                position: 'nearest',
                                caretPadding: 15,
                                displayColors: false,
                                callbacks: {
                                    title: function(tooltipItems) {
                                        const date = new Date(tooltipItems[0].parsed.x);
                                        return date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                                    },
                                    label: function(tooltipItem) {
                                        let label = tooltipItem.dataset.label || '';
                                        if (label && !['Weekly Std Dev'].includes(label)) {
                                            label += ': ';
                                        } else {
                                            label = '';
                                        }
                                        if (tooltipItem.parsed.y !== null) {
                                            label += tooltipItem.parsed.y.toFixed(1) + ' kg';
                                        }
                                        return label;
                                    }
                                }
                            },
                            zoom: {
                                zoom: {
                                    wheel: {
                                        enabled: true,
                                    },
                                    drag: {
                                        enabled: true
                                    },
                                    mode: 'xy',
                                },
                                pan: {
                                    enabled: true,
                                    mode: 'xy',
                                }
                            }
                        },
                        interaction: { 
                            mode: 'nearest',
                            axis: 'x', 
                            intersect: true
                        }
                    }
                });
            }

            function updateApp() {
                const data = getData();
                renderTable(data);
                plotGraph(data);
            }

            function renderTable(data) {
                dataTableBody.innerHTML = '';
                if (data.length === 0) {
                    dataTableBody.innerHTML = `<tr><td colspan="3" class="text-center p-6 text-slate-500">No data yet. Import a CSV or add a row to start.</td></tr>`;
                    return;
                }
                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = 'bg-white border-b hover:bg-slate-50 transition-colors';
                    row.innerHTML = `
                        <td class="px-4 py-2">
                            <input type="date" value="${item.date}" class="bg-transparent w-full p-1 rounded border border-transparent hover:border-slate-200 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition">
                        </td>
                        <td class="px-4 py-2">
                            <input type="number" step="0.1" value="${item.mass}" class="bg-transparent w-full p-1 rounded border border-transparent hover:border-slate-200 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition">
                        </td>
                        <td class="px-4 py-2 text-right">
                            <button class="delete-row-btn text-slate-400 hover:text-red-600 p-1 rounded-full hover:bg-red-100 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </td>
                    `;
                    dataTableBody.appendChild(row);
                });
                lucide.createIcons();
                document.querySelectorAll('.delete-row-btn').forEach(button => {
                    button.addEventListener('click', (e) => e.currentTarget.closest('tr').remove());
                });
            }
            
            function addNewRowToTable() {
                const data = getDataFromTable();
                const lastDate = data.length > 0 ? new Date(data[data.length - 1].date) : new Date();
                lastDate.setDate(lastDate.getDate() + 1);
                const nextDate = lastDate.toISOString().split('T')[0];

                const row = document.createElement('tr');
                row.className = 'bg-white border-b hover:bg-slate-50';
                row.innerHTML = `
                    <td class="px-4 py-2">
                        <input type="date" value="${nextDate}" class="bg-transparent w-full p-1 rounded border border-blue-300 focus:outline-none focus:ring-1 focus:ring-blue-500 transition">
                    </td>
                    <td class="px-4 py-2">
                        <input type="number" step="0.1" placeholder="0.0" class="bg-transparent w-full p-1 rounded border border-blue-300 focus:outline-none focus:ring-1 focus:ring-blue-500 transition">
                    </td>
                    <td class="px-4 py-2 text-right">
                        <button class="delete-row-btn text-slate-400 hover:text-red-600 p-1 rounded-full hover:bg-red-100 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                `;
                const placeholder = dataTableBody.querySelector('td[colspan="3"]');
                if (placeholder) placeholder.parentElement.remove();

                dataTableBody.appendChild(row);
                lucide.createIcons();
                row.querySelector('.delete-row-btn').addEventListener('click', (e) => e.currentTarget.closest('tr').remove());
                row.querySelector('input[type="number"]').focus();
            }

            function getDataFromTable() {
                const rows = dataTableBody.querySelectorAll('tr');
                const data = [];
                rows.forEach(row => {
                    const dateInput = row.querySelector('input[type="date"]');
                    const massInput = row.querySelector('input[type="number"]');
                    if (dateInput && massInput && dateInput.value && massInput.value) {
                        data.push({ date: dateInput.value, mass: parseFloat(massInput.value) });
                    }
                });
                return data.sort((a, b) => new Date(a.date) - new Date(b.date));
            }

            function saveTableData() {
                const data = getDataFromTable();
                setData(data);
                showToast('Data saved successfully!');
                updateApp();
            }

            // --- Local Storage Functions ---
            function getData() {
                try {
                    const data = localStorage.getItem('weightData');
                    return data ? JSON.parse(data).sort((a, b) => new Date(a.date) - new Date(b.date)) : [];
                } catch (e) {
                    console.error("Failed to parse data from localStorage", e);
                    return [];
                }
            }

            function setData(data) {
                localStorage.setItem('weightData', JSON.stringify(data));
            }

            // --- CSV Handling ---
            function handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = parseCSV(e.target.result);
                        if (importedData.length === 0) {
                            showToast("Could not find valid data. Ensure format is 'YYYY-MM-DD,weight'.", 'error'); return;
                        }
                        const dataMap = new Map(getData().map(d => [d.date, d.mass]));
                        importedData.forEach(d => dataMap.set(d.date, d.mass));
                        const mergedData = Array.from(dataMap, ([date, mass]) => ({ date, mass }));
                        setData(mergedData);
                        showToast(`Successfully imported and merged ${importedData.length} records.`, 'success');
                        updateApp();
                    } catch (error) {
                        showToast("An error occurred while parsing the file.", 'error'); 
                        console.error("CSV Parse Error:", error);
                    }
                };
                reader.readAsText(file);
                csvFileInput.value = '';
            }

            function parseCSV(text) {
                const data = [];
                const lines = text.split(/\r\n|\n/);
                const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
                lines.forEach(line => {
                    const parts = line.split(',');
                    if (parts.length === 2) {
                        const date = parts[0].trim();
                        const mass = parseFloat(parts[1].trim());
                        if (dateRegex.test(date) && !isNaN(mass)) data.push({ date, mass });
                    }
                });
                return data;
            }

            function exportDataToCSV() {
                const data = getData();
                if (data.length === 0) { showToast("No data to export.", 'error'); return; }
                let csvContent = "date,mass\n";
                data.forEach(row => { csvContent += `${row.date},${row.mass}\n`; });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "weight_data_export.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // --- Calculation Helper ---
            function calculateStandardDeviation(array) {
                if (array.length < 2) return 0;
                const n = array.length;
                const mean = array.reduce((a, b) => a + b) / n;
                const variance = array.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1);
                return Math.sqrt(variance);
            }

            // --- Graph Plotting ---
            function plotGraph(data) {
                if (!weightChart) initializeChart();

                if (!data || data.length < 2) {
                    weightChart.data.labels = [];
                    weightChart.data.datasets = [];
                    if (!weightChart.options.plugins.title) weightChart.options.plugins.title = {};
                    weightChart.options.plugins.title = {
                        display: true,
                        text: 'Enter at least two data points to see the graph.',
                        color: '#64748b',
                        font: { size: 16 }
                    };
                    weightChart.update();
                    return;
                }
                
                if (weightChart.options.plugins.title) weightChart.options.plugins.title.display = false;
                
                const startDate = new Date(data[0].date);

                function getDateStringFromDays(days) {
                    const newDate = new Date(startDate);
                    newDate.setDate(newDate.getDate() + days);
                    return newDate.toISOString().split('T')[0];
                }

                const plotData = data.map(d => ({ x: d.date, y: d.mass }));

                const numericalData = data.map(d => ({ 
                    days: Math.round((new Date(d.date) - startDate) / (1000 * 60 * 60 * 24)), 
                    mass: d.mass 
                }));
                
                const days = numericalData.map(d => d.days);
                const regressionPoints = numericalData.map(d => [d.days, d.mass]);
                const linFit = regression.linear(regressionPoints);

                const lastDayOfData = days.length > 0 ? Math.max(...days) : 0;
                const futureLimit = lastDayOfData + 30;

                const currentTrendPoints = days.map(day => ({ 
                    x: getDateStringFromDays(day), 
                    y: linFit.predict(day)[1] 
                }));
                
                const lastTrendPoint = { 
                    x: getDateStringFromDays(lastDayOfData), 
                    y: linFit.predict(lastDayOfData)[1] 
                };

                const futureTrendPoints = [lastTrendPoint];
                for (let i = lastDayOfData + 1; i <= futureLimit; i++) {
                    futureTrendPoints.push({ x: getDateStringFromDays(i), y: linFit.predict(i)[1] });
                }

                // --- Weekly Average & Stdev Logic ---
                const weeklyData = {};
                numericalData.forEach(d => {
                    const weekIndex = Math.floor(d.days / 7);
                    if (!weeklyData[weekIndex]) {
                        weeklyData[weekIndex] = { days: [], masses: [] };
                    }
                    weeklyData[weekIndex].days.push(d.days);
                    weeklyData[weekIndex].masses.push(d.mass);
                });

                const weeklyAveragePoints = [];
                const weeklyErrorBars = [];
                Object.keys(weeklyData).forEach(weekIndexStr => {
                    const weekIndex = parseInt(weekIndexStr);
                    const week = weeklyData[weekIndex];
                    if (week.masses.length === 0) return;
                    
                    const avgMass = week.masses.reduce((a, b) => a + b, 0) / week.masses.length;
                    const stdDev = calculateStandardDeviation(week.masses);
                    
                    const lastDayOfWeek = (weekIndex * 7) + 6;
                    const lastDateStr = getDateStringFromDays(lastDayOfWeek);

                    weeklyAveragePoints.push({ x: lastDateStr, y: avgMass });
                    weeklyErrorBars.push({ x: lastDateStr, y: [avgMass - stdDev, avgMass + stdDev] });
                });
                // --- End Weekly Logic ---

                weightChart.data.labels = [];
                weightChart.data.datasets = [
                    {
                        label: 'Daily Weight',
                        data: plotData,
                        borderColor: 'rgba(0, 0, 0, 0.3)',
                        backgroundColor: 'rgba(0, 0, 0, 0.3)',
                        pointBackgroundColor: 'rgba(0, 0, 0, 0.3)',
                        borderWidth: 1,
                        borderDash: [5, 5],
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        type: 'line',
                        order: 4
                    },
                    {
                        label: 'Trend Line',
                        data: currentTrendPoints,
                        borderColor: 'rgba(217, 70, 239, 1)', // Magenta
                        borderWidth: 2.5,
                        pointRadius: 0,
                        type: 'line',
                        order: 0
                    },
                    {
                        label: 'Future Trend',
                        data: futureTrendPoints,
                        borderColor: 'rgba(217, 70, 239, 1)', // Magenta
                        borderWidth: 2.5,
                        pointRadius: 0,
                        borderDash: [5, 5],
                        type: 'line',
                        order: 1
                    },
                    {
                        label: 'Weekly Average',
                        data: weeklyAveragePoints,
                        backgroundColor: 'rgba(255, 0, 0, 0.5)',
                        borderColor: 'rgba(255, 0, 0, 0.5)',
                        borderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        type: 'scatter',
                        order: 2,
                    },
                    {
                        label: 'Weekly Std Dev',
                        data: weeklyErrorBars,
                        backgroundColor: 'rgba(255, 0, 0, 0.5)',
                        borderColor: 'rgba(255, 0, 0, 0.5)',
                        borderWidth: { top: 3, bottom: 3, left: 0, right: 0 },
                        borderSkipped: false,
                        barPercentage: 0.2,
                        type: 'bar',
                        order: 3,
                    }
                ];
                
                weightChart.options.scales.x.max = getDateStringFromDays(futureLimit);
                weightChart.update();
            }

             // --- Chart Toggles ---
            function setupChartToggles() {
                const toggleDaily = document.getElementById('toggle-daily');
                const toggleTrend = document.getElementById('toggle-trend');
                const toggleWeekly = document.getElementById('toggle-weekly');

                const toggleListener = (event) => {
                    if (!weightChart) return;

                    const isChecked = event.target.checked;
                    const id = event.target.id;

                    switch (id) {
                        case 'toggle-daily':
                            weightChart.setDatasetVisibility(0, isChecked); // Daily Weight
                            break;
                        case 'toggle-trend':
                            weightChart.setDatasetVisibility(1, isChecked); // Trend Line
                            weightChart.setDatasetVisibility(2, isChecked); // Future Trend
                            break;
                        case 'toggle-weekly':
                            weightChart.setDatasetVisibility(3, isChecked); // Weekly Average
                            weightChart.setDatasetVisibility(4, isChecked); // Weekly Std Dev
                            break;
                    }
                    weightChart.update();
                };

                toggleDaily.addEventListener('change', toggleListener);
                toggleTrend.addEventListener('change', toggleListener);
                toggleWeekly.addEventListener('change', toggleListener);
            }

            // --- Initial Load ---
            initializeChart();
            updateApp();
            setupChartToggles();
        });
    </script>
</body>
</html>
