<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weight Tracker</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js for graphing -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Date adapter for Chart.js to handle time scales -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <!-- Zoom plugin for Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <!-- regression-js for trendlines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/regression/2.0.1/regression.min.js"></script>
    
    <!-- Lucide Icons for UI elements -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Custom font and base styles */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* --- App Layout --- */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .app-header {
            flex-shrink: 0;
        }
        .app-content {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 80px; /* Space for FAB */
        }
        
        /* --- Modal Styles --- */
        .modal {
            transition: opacity 0.25s ease;
        }
        .modal-content {
            transition: transform 0.25s ease;
        }

        /* --- Custom Toast/Alert --- */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translate(-50%, 150%);
            transition: transform 0.5s ease-in-out;
            z-index: 100;
        }
        #toast.show {
            transform: translate(-50%, 0);
        }

        /* --- Tab Navigation --- */
        .tab-content {
            display: none;
            height: 100%;
        }
        .tab-content.active {
            display: block;
        }

        /* Chart Canvas Cursor Styles based on mode */
        #weightChart.cursor-crosshair {
            cursor: crosshair;
        }
        #weightChart.cursor-grab {
            cursor: grab;
        }
        #weightChart.cursor-move {
            cursor: move;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <div id="loading-overlay" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
        <div class="flex flex-col items-center gap-4">
            <svg class="animate-spin h-8 w-8 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-slate-500">Loading application...</p>
        </div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header bg-white shadow-md z-20">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <h1 id="header-title" class="text-xl font-bold text-slate-900">Weight Tracker</h1>
                    <div class="flex items-center gap-2">
                        
                        <!-- Draw Line Button -->
                        <button id="drawLineBtn" title="Draw/Drag Custom Line" class="p-2 rounded-full hover:bg-slate-100 transition text-red-500">
                            <i data-lucide="line-chart" class="w-5 h-5"></i>
                        </button>

                        <!-- Import Button -->
                        <button id="importButton" title="Import from CSV" class="p-2 rounded-full hover:bg-slate-100 transition text-emerald-600">
                            <i data-lucide="upload-cloud" class="w-5 h-5"></i>
                        </button>
                        
                        <!-- Export Button -->
                        <button id="exportButton" title="Export to CSV" class="p-2 rounded-full hover:bg-slate-100 transition text-slate-500">
                            <i data-lucide="download-cloud" class="w-5 h-5"></i>
                        </button>

                        <!-- Tab Buttons -->
                        <div class="flex items-center gap-1 p-1 bg-slate-100 rounded-lg">
                            <button data-tab="chart-tab" class="tab-btn px-3 py-1 text-sm font-semibold rounded-md bg-white shadow-sm text-indigo-600">Chart</button>
                            <button data-tab="history-tab" class="tab-btn px-3 py-1 text-sm font-semibold rounded-md text-slate-500">History</button>
                        </div>
                        
                        <!-- Zoom Toggle Button -->
                        <button id="toggle-zoom-btn" title="Toggle Zoom Mode" class="p-2 rounded-full hover:bg-slate-100 text-slate-600">
                            <i data-lucide="search" class="w-5 h-5"></i>
                        </button>
                        
                        <!-- Reset Zoom Button -->
                        <button id="reset-zoom-btn" title="Reset Zoom" class="p-2 rounded-full hover:bg-slate-100 text-slate-600">
                            <i data-lucide="zoom-out" class="w-5 h-5"></i>
                        </button>

                        <!-- Input Box for Future Trend -->
                        <div id="future-controls" class="items-center gap-1 sm:flex">
                            <input type="number" id="future-days-input" value="30" min="1" max="365" class="w-14 text-center p-1 text-sm rounded-md border border-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <label for="future-days-input" class="text-sm font-medium text-slate-500">day trend</label>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content (Swappable Tabs) -->
        <main class="app-content">
            <!-- Chart Tab -->
            <div id="chart-tab" class="tab-content active h-full p-4">
                <section class="bg-white p-4 rounded-xl shadow-lg h-full flex flex-col relative">
                    <div id="empty-chart-state" class="absolute inset-0 flex flex-col items-center justify-center text-center p-8 text-slate-500 bg-white/70 backdrop-blur-sm z-10 hidden">
                        <i data-lucide="line-chart" class="w-12 h-12 mx-auto mb-2 text-indigo-400"></i>
                        <h2 class="text-xl font-semibold mb-2">Ready to track your progress!</h2>
                        <p class="mb-4">Enter at least two data points to generate your weight chart and trendlines.</p>
                        <p>Tap the <i data-lucide="plus" class="inline-block w-4 h-4 translate-y-0.5"></i> button below to start.</p>
                    </div>
                    <div class="relative flex-grow">
                        <!-- Canvas is now referenced by ID -->
                        <canvas id="weightChart"></canvas>
                    </div>
                </section>
            </div>

            <!-- History Tab -->
            <div id="history-tab" class="tab-content p-4">
                <div id="history-list" class="space-y-3">
                    <!-- History cards will be inserted here -->
                </div>
            </div>
        </main>

        <!-- Floating Action Button (FAB) -->
        <button id="fab-add-btn" class="fixed bottom-6 right-6 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full p-4 shadow-lg transition-transform transform hover:scale-110 z-30">
            <i data-lucide="plus" class="w-6 h-6"></i>
        </button>
    </div>

    <!-- Add/Edit Entry Modal -->
    <div id="entry-modal" class="modal fixed inset-0 bg-black bg-opacity-40 z-50 hidden items-center justify-center p-4 opacity-0">
        <div id="entry-modal-content" class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-sm transform scale-95">
            <div class="p-6">
                <h3 id="entry-modal-title" class="text-lg font-bold text-slate-800 mb-4">Add New Entry</h3>
                <div class="space-y-4">
                    <div>
                        <label for="entry-date" class="block text-sm font-medium text-slate-600 mb-1">Date</label>
                        <input type="date" id="entry-date" class="w-full p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label for="entry-weight" class="block text-sm font-medium text-slate-600 mb-1">Weight (kg)</label>
                        <input type="number" id="entry-weight" step="0.1" placeholder="0.0" class="w-full p-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
            </div>
            <div class="bg-slate-50 px-6 py-3 flex justify-end gap-3 rounded-b-xl">
                <button id="entry-modal-cancel" class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-200 font-semibold transition">Cancel</button>
                <button id="entry-modal-save" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition">Save</button>
            </div>
        </div>
    </div>
    
    <!-- Hidden file input -->
    <input type="file" id="csvFileInput" class="hidden" accept=".csv">

    <!-- Custom Toast Notification -->
    <div id="toast" class="py-3 px-5 rounded-lg shadow-lg text-white font-semibold">
        <span id="toast-message"></span>
    </div>

    <script>
        // Global state for drawing the custom line and zoom mode
        let isDrawingMode = false;
        let isZoomModeActive = false;
        let customLinePoints = []; // Holds the persistent 2 points for the drawn line
        
        // Dragging State
        let draggingIndex = -1; // -1: not dragging, 0: dragging start point, 1: dragging end point
        let isDragging = false; 

        let weightChart;
        let currentEditDate = null; 
        let allWeightData = []; 

        document.addEventListener('DOMContentLoaded', () => {
            // --- Element Selectors ---
            const importButton = document.getElementById('importButton');
            const drawLineBtn = document.getElementById('drawLineBtn'); 
            const chartCanvas = document.getElementById('weightChart'); 
            const exportButton = document.getElementById('exportButton');
            const fabAddBtn = document.getElementById('fab-add-btn');
            const csvFileInput = document.getElementById('csvFileInput');
            const historyList = document.getElementById('history-list');
            const ctx = chartCanvas.getContext('2d');
            const resetZoomBtn = document.getElementById('reset-zoom-btn');
            const toggleZoomBtn = document.getElementById('toggle-zoom-btn');
            const entryModal = document.getElementById('entry-modal');
            const entryModalContent = document.getElementById('entry-modal-content');
            const entryModalTitle = document.getElementById('entry-modal-title');
            const entryModalCancel = document.getElementById('entry-modal-cancel');
            const entryModalSave = document.getElementById('entry-modal-save');
            const entryDate = document.getElementById('entry-date');
            const entryWeight = document.getElementById('entry-weight');
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            const loadingOverlay = document.getElementById('loading-overlay');
            const futureDaysInput = document.getElementById('future-days-input');
            const futureControls = document.getElementById('future-controls');
            const emptyChartState = document.getElementById('empty-chart-state');

            
            // --- Initialize UI Components ---
            lucide.createIcons();

            // --- Custom Toast Notification (Self-contained) ---
            const showToast = (() => {
                let toastTimer;
                return (message, type = 'success', duration = 3000) => {
                    const toast = document.getElementById('toast');
                    const toastMessage = document.getElementById('toast-message');
                    if (!toast || !toastMessage) return;

                    clearTimeout(toastTimer);

                    toastMessage.textContent = message;
                    toast.className = 'py-3 px-5 rounded-lg shadow-lg text-white font-semibold';
                    const typeClasses = { success: 'bg-emerald-500', error: 'bg-red-500', info: 'bg-slate-700' };
                    toast.classList.add(typeClasses[type] || typeClasses.info);
                    
                    toast.classList.add('show');
                    
                    toastTimer = setTimeout(() => {
                        toast.classList.remove('show');
                    }, duration);
                };
            })();


            // --- Event Listeners ---
            importButton.addEventListener('click', () => { csvFileInput.click(); });
            csvFileInput.addEventListener('change', handleFileUpload);
            exportButton.addEventListener('click', () => { exportDataToCSV(); });
            fabAddBtn.addEventListener('click', openAddModal);
            
            resetZoomBtn.addEventListener('click', () => { 
                if (weightChart) {
                    weightChart.resetZoom();
                    if (isZoomModeActive) {
                        weightChart.options.plugins.zoom.zoom.enabled = true;
                        weightChart.options.plugins.zoom.pan.enabled = true;
                    }
                    weightChart.update();
                    showToast('Zoom reset.', 'info', 1500);
                }
            });

            // Toggle Zoom Listener
            toggleZoomBtn.addEventListener('click', toggleZoomMode);
            
            entryModalCancel.addEventListener('click', closeEntryModal);
            entryModalSave.addEventListener('click', saveEntry);
            tabButtons.forEach(button => button.addEventListener('click', switchTab));
            futureDaysInput.addEventListener('input', () => {
                const data = getData();
                if (data.length > 1) {
                    plotGraph(data);
                }
            });

            // --- Draw Line Feature Listeners ---
            drawLineBtn.addEventListener('click', toggleDrawLineMode);
            chartCanvas.addEventListener('pointerdown', handleChartPointerDown); 


            // --- Utility: Calculate Custom Line Formula (y = m*x + b) ---
            function calculateCustomLineFormula(points, xScale) {
                if (points.length !== 2) return null;

                const p1 = points[0];
                const p2 = points[1];

                // Convert Date X values to numerical days since chart start for slope calculation
                const data = allWeightData;
                const startDate = data.length > 0 ? new Date(data[0].date) : new Date(p1.x);

                const getDays = (timestamp) => {
                    const date = new Date(timestamp);
                    return Math.round((date - startDate) / (1000 * 60 * 60 * 24));
                };

                // Use dates if possible, otherwise use the Chart.js timestamp for the graph
                const x1 = xScale.options.type === 'time' ? getDays(p1.x) : p1.x;
                const x2 = xScale.options.type === 'time' ? getDays(p2.x) : p2.x;
                const y1 = p1.y;
                const y2 = p2.y;

                if (x1 === x2) return "Vertical Line";

                // Slope (m)
                const m = (y2 - y1) / (x2 - x1);
                // Y-intercept (b) using y = mx + b -> b = y - mx
                const b = y1 - m * x1;

                const rate = Math.abs(m * 30).toFixed(2); // Change over 30 days
                const sign = m > 0 ? 'gaining' : 'losing';
                const trend = m.toFixed(3);

                // Format the formula
                const formula = `y = ${m.toFixed(4)}x ${b >= 0 ? '+' : '-'} ${Math.abs(b).toFixed(2)}`;
                const interpretation = `Avg. ${sign} ${rate} kg per 30 days.`;

                return [formula, interpretation];
            }


            // --- Chart.js Custom Draggable Plugin ---
            const draggableCustomLinePlugin = {
                id: 'draggableCustomLine',
                
                // Helper to check if mouse is near a point (using a pixel radius)
                isNearPoint: function(chart, event, point) {
                    const radius = 10;
                    // event.x and event.y are canvas-relative coordinates provided by Chart.js
                    const dx = event.x - point.x; 
                    const dy = event.y - point.y;
                    return Math.sqrt(dx * dx + dy * dy) < radius;
                },

                afterEvent: function(chart, args) {
                    const event = args.event;
                    // FIX: Find the correct array index of the custom line dataset
                    const datasetIndex = chart.data.datasets.findIndex(d => d.label === 'Custom Line');

                    // 1. Basic checks
                    if (datasetIndex === -1) {
                        isDragging = false;
                        draggingIndex = -1;
                        chartCanvas.classList.remove('cursor-move');
                        if (!isDrawingMode && !isZoomModeActive) { chartCanvas.style.cursor = ''; }
                        return;
                    }
                    
                    const dataset = chart.data.datasets[datasetIndex];
                    if (dataset.data.length < 2) {
                        isDragging = false;
                        draggingIndex = -1;
                        chartCanvas.classList.remove('cursor-move');
                        if (!isDrawingMode && !isZoomModeActive) { chartCanvas.style.cursor = ''; }
                        return;
                    }

                    // Get the meta data using the correct array index
                    const meta = chart.getDatasetMeta(datasetIndex); 
                    const points = meta.data;
                    
                    const hitIndex = points.findIndex(point => this.isNearPoint(chart, event, point));
                    
                    // 2. Handle Cursor Change (only if not currently dragging and not in a special mode)
                    if (!isDragging && !isDrawingMode && !isZoomModeActive) {
                        if (hitIndex !== -1) {
                            chartCanvas.classList.add('cursor-move');
                        } else {
                            chartCanvas.classList.remove('cursor-move');
                            chartCanvas.style.cursor = '';
                        }
                    }

                    // 3. Handle Mouse Down (Start Drag)
                    if (event.type === 'mousedown' && hitIndex !== -1 && !isDrawingMode && !isZoomModeActive) {
                        isDragging = true;
                        draggingIndex = hitIndex;
                        args.changed = true; // Tell Chart.js we modified state
                        return;
                    }

                    // 4. Handle Mouse Move (Dragging)
                    if (event.type === 'mousemove' && isDragging) {
                        const xScale = chart.scales['x'];
                        const yScale = chart.scales['y'];
                        const chartArea = chart.chartArea;
                        
                        // Use event.x and event.y as pixel coordinates
                        const xPx = Math.min(Math.max(event.x, chartArea.left), chartArea.right);
                        const yPx = Math.min(Math.max(event.y, chartArea.top), chartArea.bottom);

                        const newXValue = xScale.getValueForPixel(xPx);
                        const newYValue = yScale.getValueForPixel(yPx);
                        
                        // Update the persistent global state array
                        customLinePoints[draggingIndex] = { x: newXValue, y: newYValue };
                        
                        // Update Chart.js dataset directly
                        dataset.data = customLinePoints;

                        // Force redraw
                        chart.update('none'); // 'none' is fastest update
                        args.changed = true;
                        return;
                    }

                    // 5. Handle Mouse Up (End Drag)
                    if (event.type === 'mouseup' && isDragging) {
                        isDragging = false;
                        draggingIndex = -1;
                        chart.update('default');
                        showToast('Custom line point adjusted.', 'info', 1500);
                        args.changed = true;
                        return;
                    }
                }
            };

            Chart.register(draggableCustomLinePlugin);


            // --- Zoom Mode Logic ---
            function toggleZoomMode() {
                isZoomModeActive = !isZoomModeActive;
                
                if (isDrawingMode) toggleDrawLineMode(); 
                isDragging = false; // Stop dragging if active

                if (isZoomModeActive) {
                    weightChart.options.plugins.zoom.zoom.enabled = true;
                    weightChart.options.plugins.zoom.pan.enabled = true;
                    chartCanvas.classList.add('cursor-grab'); 
                    chartCanvas.classList.remove('cursor-move', 'cursor-crosshair');
                    
                    toggleZoomBtn.classList.add('bg-indigo-500', 'text-white', 'ring-2', 'ring-indigo-500');
                    toggleZoomBtn.classList.remove('hover:bg-slate-100', 'text-slate-600');
                    showToast('Zoom Mode Active. Drag the chart to zoom/pan.', 'info', 3000);

                } else {
                    weightChart.options.plugins.zoom.zoom.enabled = false;
                    weightChart.options.plugins.zoom.pan.enabled = false;
                    chartCanvas.classList.remove('cursor-grab');
                    chartCanvas.style.cursor = ''; 
                    
                    toggleZoomBtn.classList.remove('bg-indigo-500', 'text-white', 'ring-2', 'ring-indigo-500');
                    toggleZoomBtn.classList.add('hover:bg-slate-100', 'text-slate-600');
                    showToast('Zoom Mode Deactivated.', 'info', 2000);
                }
                
                weightChart.update('default'); 
            }

            // --- Draw Line Feature Logic ---
            function toggleDrawLineMode() {
                isDrawingMode = !isDrawingMode;
                
                if (isZoomModeActive) toggleZoomMode(); 
                isDragging = false; // Stop dragging if active

                if (isDrawingMode) {
                    customLinePoints = [];
                    // Clear visualization immediately (dataset index 7 is Custom Line)
                    const customLineDatasetIndex = weightChart.data.datasets.findIndex(d => d.label === 'Custom Line');
                    if (weightChart && customLineDatasetIndex !== -1) {
                        weightChart.data.datasets[customLineDatasetIndex].data = [];
                        weightChart.update(); 
                    }

                    drawLineBtn.classList.add('bg-red-500', 'text-white', 'ring-2', 'ring-red-500');
                    drawLineBtn.classList.remove('hover:bg-slate-100', 'text-red-500');
                    chartCanvas.classList.add('cursor-crosshair'); 
                    chartCanvas.classList.remove('cursor-move', 'cursor-grab');
                    showToast('Draw Line mode activated. Click chart to set start point.', 'info', 4000);
                } else {
                    drawLineBtn.classList.remove('bg-red-500', 'text-white', 'ring-2', 'ring-red-500');
                    drawLineBtn.classList.add('hover:bg-slate-100', 'text-red-500');
                    chartCanvas.classList.remove('cursor-crosshair');
                    chartCanvas.style.cursor = ''; 
                    
                    if (customLinePoints.length < 2) {
                        customLinePoints = [];
                        const customLineDatasetIndex = weightChart.data.datasets.findIndex(d => d.label === 'Custom Line');
                        if (weightChart && customLineDatasetIndex !== -1) {
                            weightChart.data.datasets[customLineDatasetIndex].data = [];
                            weightChart.update();
                        }
                    }
                }
            }
            
            function handleChartPointerDown(event) {
                if (!isDrawingMode || isZoomModeActive || !weightChart || isDragging) return;
                
                // Get data values from pixel coordinates
                const rect = chartCanvas.getBoundingClientRect();
                const offsetX = event.clientX - rect.left;
                const offsetY = event.clientY - rect.top;

                const chartArea = weightChart.chartArea;
                if (offsetX < chartArea.left || offsetX > chartArea.right || 
                    offsetY < chartArea.top || offsetY > chartArea.bottom) {
                    showToast('Click within the chart area to set a point.', 'error', 2000);
                    return;
                }

                const xScale = weightChart.scales['x'];
                const yScale = weightChart.scales['y'];
                const xValue = xScale.getValueForPixel(offsetX);
                const yValue = yScale.getValueForPixel(offsetY);

                const newPoint = { x: xValue, y: yValue };
                
                const customLineDatasetIndex = weightChart.data.datasets.findIndex(d => d.label === 'Custom Line');

                if (customLinePoints.length === 0) {
                    // First point (Start)
                    customLinePoints.push(newPoint);
                    if (customLineDatasetIndex !== -1) {
                        weightChart.data.datasets[customLineDatasetIndex].data = [newPoint]; 
                        weightChart.update(); 
                    }
                    showToast('Start point set. Click again for the end point.', 'info', 3000);

                } else if (customLinePoints.length === 1) {
                    // Second point (End)
                    customLinePoints.push(newPoint);
                    
                    if (customLineDatasetIndex !== -1) {
                        weightChart.data.datasets[customLineDatasetIndex].data = customLinePoints;
                        weightChart.update(); 
                    }
                    
                    showToast('Custom line drawn! Drawing mode deactivated. You can now drag the end points.', 'success', 3000);
                    toggleDrawLineMode(); 
                }
            }
            // --- End Draw Line Feature Logic ---


            // --- Tab Navigation ---
            function switchTab(event) {
                const tabId = event.currentTarget.dataset.tab;
                
                tabContents.forEach(content => {
                    content.classList.toggle('active', content.id === tabId);
                });

                tabButtons.forEach(button => {
                    const isSelected = button.dataset.tab === tabId;
                    button.classList.toggle('bg-white', isSelected);
                    button.classList.toggle('shadow-sm', isSelected);
                    button.classList.toggle('text-indigo-600', isSelected);
                    button.classList.toggle('text-slate-500', !isSelected);
                });

                if (tabId === 'chart-tab') {
                    futureControls.classList.remove('hidden');
                    futureControls.classList.add('sm:flex');
                    if (weightChart) weightChart.resize();
                } else {
                    futureControls.classList.add('hidden');
                    futureControls.classList.remove('sm:flex');
                }
            }

            // --- Modal Logic ---
            function openAddModal() {
                currentEditDate = null;
                entryModalTitle.textContent = 'Add New Entry';
                entryDate.value = new Date().toISOString().split('T')[0];
                entryWeight.value = '';
                entryDate.disabled = false;
                openEntryModal();
            }
            function openEditModal(date, weight) {
                currentEditDate = date;
                entryModalTitle.textContent = 'Edit Entry';
                entryDate.value = date;
                entryWeight.value = weight;
                entryDate.disabled = true;
                openEntryModal();
            }
            function openEntryModal() {
                entryModal.classList.remove('hidden');
                setTimeout(() => {
                    entryModal.classList.remove('opacity-0');
                    entryModalContent.classList.remove('scale-95');
                    entryWeight.focus();
                }, 10);
            }
            function closeEntryModal() {
                entryModal.classList.add('opacity-0');
                entryModalContent.classList.add('scale-95');
                setTimeout(() => { entryModal.classList.add('hidden'); }, 250);
            }

            // --- Core App Functions ---
            function initializeChart() {
                weightChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: [] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { 
                                type: 'time', 
                                position: 'bottom',
                                time: {
                                    unit: 'day',
                                    tooltipFormat: 'MMM d, yyyy', 
                                    displayFormats: { day: 'MMM d' }
                                },
                                grid: { color: '#e2e8f0' } 
                            },
                            y: { 
                                position: 'left',
                                title: { display: true, text: 'Weight (kg)' }, 
                                grid: { color: '#e2e8f0' } 
                            }
                        },
                        plugins: {
                            legend: { 
                                display: true,
                                position: 'top',
                                align: 'start',
                                onClick: (e, legendItem, legend) => {
                                    const index = legendItem.datasetIndex;
                                    const ci = legend.chart;
                                    const meta = ci.getDatasetMeta(index);
                                    
                                    meta.hidden = meta.hidden === null ? !ci.data.datasets[index].hidden : null;

                                    // Special handling for multi-dataset elements
                                    const label = legendItem.text;
                                    if (label === 'Daily Trend') {
                                        ci.getDatasetMeta(ci.data.datasets.findIndex(d => d.label === 'Daily Future Trend')).hidden = meta.hidden; 
                                    } else if (label === 'Weekly Average') {
                                        ci.getDatasetMeta(ci.data.datasets.findIndex(d => d.label === 'Weekly Std Dev')).hidden = meta.hidden; 
                                    } else if (label === 'Weekly Trend') {
                                        ci.getDatasetMeta(ci.data.datasets.findIndex(d => d.label === 'Weekly Future Trend')).hidden = meta.hidden; 
                                    }
                                    
                                    ci.update();
                                },
                                labels: {
                                    sort: (a, b) => {
                                        const legendOrder = ['Daily Weight', 'Daily Trend', 'Weekly Average', 'Weekly Trend', 'Custom Line'];
                                        return legendOrder.indexOf(a.text) - legendOrder.indexOf(b.text);
                                    },
                                    filter: (item) => !['Daily Future Trend', 'Weekly Std Dev', 'Weekly Future Trend'].includes(item.text)
                                }
                             },
                            tooltip: { 
                                enabled: true, mode: 'nearest', intersect: true, position: 'nearest', caretPadding: 10, displayColors: false,
                                callbacks: {
                                    title: (items) => {
                                        // Check if the item belongs to the Custom Line
                                        const customLineItem = items.find(item => item.dataset.label === 'Custom Line');
                                        if (customLineItem && customLinePoints.length === 2) {
                                            const formula = calculateCustomLineFormula(customLinePoints, weightChart.scales['x']);
                                            return formula ? `Goal Line: ${formula[0]}` : 'Custom Line';
                                        }
                                        // Standard title for other datasets
                                        if (items.length > 0) {
                                            return new Date(items[0].parsed.x).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                                        }
                                        return '';
                                    },
                                    label: (item) => {
                                        if (item.dataset.label === 'Custom Line' && customLinePoints.length === 2) {
                                            const formula = calculateCustomLineFormula(customLinePoints, weightChart.scales['x']);
                                            return formula ? formula[1] : '';
                                        }
                                        return `${item.dataset.label || ''}: ${item.parsed.y.toFixed(1)} kg`;
                                    }
                                }
                            },
                            zoom: {
                                zoom: { drag: { enabled: false }, mode: 'xy' },
                                pan: { enabled: false, mode: 'xy' },
                                onZoomComplete: ({ chart }) => {},
                                onPanComplete: ({ chart }) => {}
                            },
                            draggableCustomLine: {} // Enable the custom plugin
                        },
                        interaction: { mode: 'nearest', axis: 'x', intersect: true }
                    }
                });
            }

            // --- App Update Function ---
            function updateApp() {
                allWeightData = getData(); 
                renderHistoryList(allWeightData);
                plotGraph(allWeightData);
            }

            function renderHistoryList(data) {
                historyList.innerHTML = '';
                if (data.length === 0) {
                    historyList.innerHTML = `<div class="text-center p-10 text-slate-500">
                        <i data-lucide="clipboard-list" class="w-12 h-12 mx-auto mb-2"></i>
                        <p>No data yet.</p>
                        <p>Tap the '+' button to add your first entry.</p>
                    </div>`;
                    lucide.createIcons();
                    return;
                }
                data.slice().reverse().forEach(item => { 
                    const card = document.createElement('div');
                    card.className = 'bg-white p-4 rounded-lg shadow-sm flex items-center justify-between';
                    const date = new Date(item.date + 'T00:00:00'); 
                    const formattedDate = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

                    card.innerHTML = `
                        <div>
                            <p class="font-semibold text-slate-800">${item.mass.toFixed(1)} kg</p>
                            <p class="text-sm text-slate-500">${formattedDate}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button class="edit-btn p-2 rounded-full hover:bg-slate-100 text-slate-500" data-date="${item.date}" data-weight="${item.mass}">
                                <i data-lucide="edit-2" class="w-4 h-4"></i>
                            </button>
                            <button class="delete-btn p-2 rounded-full hover:bg-red-100 text-red-500" data-date="${item.date}">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    historyList.appendChild(card);
                });
                lucide.createIcons();
                historyList.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => {
                    const { date, weight } = e.currentTarget.dataset;
                    openEditModal(date, parseFloat(weight));
                }));
                historyList.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', (e) => {
                    const dateToDelete = e.currentTarget.dataset.date;
                    let data = getData();
                    data = data.filter(d => d.date !== dateToDelete);
                    setData(data);
                    showToast('Entry deleted!');
                    updateApp();
                }));
            }
            
            function saveEntry() {
                const date = entryDate.value;
                const weight = parseFloat(entryWeight.value);

                if (!date || isNaN(weight) || weight <= 0) {
                    showToast('Please enter a valid date and weight greater than 0.', 'error');
                    return;
                }

                let data = getData();
                if (currentEditDate) { 
                    const index = data.findIndex(d => d.date === currentEditDate);
                    if (index > -1) {
                        data[index].mass = weight;
                    }
                } else { 
                    if (data.some(d => d.date === date)) {
                        showToast('An entry for this date already exists.', 'error');
                        return;
                    }
                    data.push({ date, mass: weight });
                }
                
                setData(data);
                showToast('Entry saved!');
                updateApp();
                closeEntryModal();
            }

            // --- Local Storage Functions ---
            function getData() {
                try {
                    const data = localStorage.getItem('weightData');
                    // Ensure sorting happens here to find the correct startDate for the formula
                    return data ? JSON.parse(data).sort((a, b) => new Date(a.date) - new Date(b.date)) : [];
                } catch (e) {
                    console.error("Failed to parse data from localStorage", e);
                    return [];
                }
            }

            function setData(data) {
                localStorage.setItem('weightData', JSON.stringify(data));
            }

            // --- CSV Handling ---
            function handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = parseCSV(e.target.result);
                        if (importedData.length === 0) {
                            showToast("Could not find valid data. Ensure format is 'YYYY-MM-DD,weight'.", 'error'); return;
                        }
                        const dataMap = new Map(getData().map(d => [d.date, d.mass]));
                        importedData.forEach(d => dataMap.set(d.date, d.mass));
                        const mergedData = Array.from(dataMap, ([date, mass]) => ({ date, mass }));
                        setData(mergedData);
                        showToast(`Successfully imported and merged ${importedData.length} records.`, 'success');
                        updateApp();
                    } catch (error) {
                        showToast("An error occurred while parsing the file.", 'error'); 
                        console.error("CSV Parse Error:", error);
                    }
                };
                reader.readAsText(file);
                csvFileInput.value = '';
            }

            function parseCSV(text) {
                const data = [];
                const lines = text.split(/\r\n|\n/);
                const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
                lines.forEach(line => {
                    const parts = line.split(',');
                    if (parts.length === 2) {
                        const date = parts[0].trim();
                        const mass = parseFloat(parts[1].trim());
                        if (dateRegex.test(date) && !isNaN(mass) && mass > 0) data.push({ date, mass });
                    }
                });
                return data;
            }

            function exportDataToCSV() {
                const data = getData();
                if (data.length === 0) { showToast("No data to export.", 'error'); return; }
                let csvContent = "date,mass\n";
                data.forEach(row => { csvContent += `${row.date},${row.mass}\n`; });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "weight_data_export.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // --- Calculation Helper ---
            function calculateStandardDeviation(array) {
                if (array.length < 2) return 0;
                const n = array.length;
                const mean = array.reduce((a, b) => a + b) / n;
                const variance = array.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1);
                return Math.sqrt(variance);
            }

            // --- Graph Plotting ---
            function plotGraph(data) {
                if (!weightChart) initializeChart();

                const showEmptyState = data.length < 2;
                emptyChartState.classList.toggle('hidden', !showEmptyState);
                if (showEmptyState) {
                    weightChart.data.labels = [];
                    weightChart.data.datasets = [];
                    if (!weightChart.options.plugins.title) weightChart.options.plugins.title = {};
                    weightChart.update();
                    return;
                }
                
                if (weightChart.options.plugins.title) weightChart.options.plugins.title.display = false;
                
                // Get the start date from the already sorted data
                const startDate = new Date(data[0].date); 

                function getDateStringFromDays(days) {
                    const newDate = new Date(startDate);
                    newDate.setDate(newDate.getDate() + days);
                    return newDate.toISOString().split('T')[0];
                }

                const plotData = data.map(d => ({ x: d.date, y: d.mass }));

                const numericalData = data.map(d => ({ 
                    days: Math.round((new Date(d.date) - startDate) / (1000 * 60 * 60 * 24)), 
                    mass: d.mass 
                }));
                
                const days = numericalData.map(d => d.days);
                const regressionPoints = numericalData.map(d => [d.days, d.mass]);
                const linFit = regression.linear(regressionPoints);

                const futureDays = parseInt(futureDaysInput.value, 10) || 30;
                const lastDayOfData = days.length > 0 ? Math.max(...days) : 0;
                const futureLimit = lastDayOfData + futureDays;

                const currentTrendPoints = days.map(day => ({ 
                    x: getDateStringFromDays(day), 
                    y: linFit.predict(day)[1] 
                }));
                
                const lastTrendPoint = { 
                    x: getDateStringFromDays(lastDayOfData), 
                    y: linFit.predict(lastDayOfData)[1] 
                };

                const futureTrendPoints = [lastTrendPoint];
                for (let i = lastDayOfData + 1; i <= futureLimit; i++) {
                    futureTrendPoints.push({ x: getDateStringFromDays(i), y: linFit.predict(i)[1] });
                }

                // --- Weekly Average & Stdev Logic ---
                const weeklyData = {};
                numericalData.forEach(d => {
                    const weekIndex = Math.floor(d.days / 7);
                    if (!weeklyData[weekIndex]) {
                        weeklyData[weekIndex] = { days: [], masses: [] };
                    }
                    weeklyData[weekIndex].days.push(d.days);
                    weeklyData[weekIndex].masses.push(d.mass);
                });

                const weeklyAveragePoints = [];
                const weeklyErrorBars = [];
                const weeklyRegressionPoints = [];
                Object.keys(weeklyData).forEach(weekIndexStr => {
                    const weekIndex = parseInt(weekIndexStr);
                    const week = weeklyData[weekIndex];
                    if (week.masses.length === 0) return;
                    
                    const avgMass = week.masses.reduce((a, b) => a + b, 0) / week.masses.length;
                    const stdDev = calculateStandardDeviation(week.masses);
                    
                    const dayOfEntry = Math.max(...week.days);
                    const entryDateStr = getDateStringFromDays(dayOfEntry);

                    weeklyAveragePoints.push({ x: entryDateStr, y: avgMass });
                    weeklyErrorBars.push({ x: entryDateStr, y: [avgMass - stdDev, avgMass + stdDev] });
                    weeklyRegressionPoints.push([dayOfEntry, avgMass]);
                });
                // --- End Weekly Logic ---

                // --- Weekly Trend Calculation ---
                const weeklyLinFit = regression.linear(weeklyRegressionPoints);
                const weeklyCurrentTrendPoints = days.map(day => ({
                    x: getDateStringFromDays(day),
                    y: weeklyLinFit.predict(day)[1]
                }));
                const weeklyLastTrendPoint = {
                    x: getDateStringFromDays(lastDayOfData),
                    y: weeklyLinFit.predict(lastDayOfData)[1]
                };
                const weeklyFutureTrendPoints = [weeklyLastTrendPoint];
                for (let i = lastDayOfData + 1; i <= futureLimit; i++) {
                    weeklyFutureTrendPoints.push({ x: getDateStringFromDays(i), y: weeklyLinFit.predict(i)[1] });
                }
                // --- End Weekly Trend Calculation ---
                
                // --- Dataset Definitions ---
                weightChart.data.labels = [];
                weightChart.data.datasets = [
                    {
                        label: 'Daily Weight',
                        data: plotData,
                        borderColor: 'rgba(0, 0, 0, 0.3)',
                        backgroundColor: 'rgba(0, 0, 0, 0.3)',
                        pointBackgroundColor: 'rgba(0, 0, 0, 0.3)',
                        borderWidth: 1,
                        borderDash: [5, 5],
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        type: 'line',
                        order: 5
                    },
                    {
                        label: 'Daily Trend',
                        data: currentTrendPoints,
                        borderColor: 'rgba(217, 70, 239, 1)', 
                        backgroundColor: 'rgba(217, 70, 239, 1)', 
                        borderWidth: 2.5,
                        pointRadius: 0,
                        type: 'line',
                        order: 0
                    },
                    {
                        label: 'Daily Future Trend',
                        data: futureTrendPoints,
                        borderColor: 'rgba(217, 70, 239, 1)', 
                        backgroundColor: 'rgba(217, 70, 239, 1)', 
                        borderWidth: 2.5,
                        pointRadius: 0,
                        borderDash: [5, 5],
                        type: 'line',
                        order: 1
                    },
                    {
                        label: 'Weekly Average',
                        data: weeklyAveragePoints,
                        backgroundColor: 'rgba(52, 211, 153, 1)', 
                        borderColor: 'rgba(52, 211, 153, 1)', 
                        borderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        type: 'scatter',
                        order: 3,
                    },
                    {
                        label: 'Weekly Std Dev',
                        data: weeklyErrorBars,
                        backgroundColor: 'rgba(52, 211, 153, 0.2)', 
                        borderColor: 'rgba(52, 211, 153, 0.5)',
                        borderWidth: 0, 
                        borderSkipped: false,
                        barPercentage: 0.2,
                        type: 'bar',
                        order: 4,
                    },
                    {
                        label: 'Weekly Trend',
                        data: weeklyCurrentTrendPoints,
                        backgroundColor: 'rgba(59, 130, 246, 1)', 
                        borderColor: 'rgba(59, 130, 246, 1)', 
                        borderWidth: 2.5,
                        pointRadius: 0,
                        type: 'line',
                        order: 2
                    },
                    {
                        label: 'Weekly Future Trend',
                        data: weeklyFutureTrendPoints,
                        borderColor: 'rgba(59, 130, 246, 1)', 
                        borderWidth: 2.5,
                        pointRadius: 0,
                        borderDash: [5, 5],
                        type: 'line',
                        order: 2
                    },
                    // Custom Line Dataset 
                    {
                        label: 'Custom Line',
                        data: customLinePoints, 
                        borderColor: 'rgba(239, 68, 68, 1)', 
                        backgroundColor: 'rgba(239, 68, 68, 1)',
                        borderWidth: 3,
                        pointRadius: 8, 
                        pointHoverRadius: 10,
                        fill: false,
                        tension: 0,
                        type: 'line',
                        order: -1 // Highest priority layer
                    }
                ];
                
                weightChart.options.scales.x.max = getDateStringFromDays(futureLimit);
                weightChart.update(); 
            }

            // --- Initial Load ---
            setTimeout(() => {
                initializeChart();
                updateApp();
                loadingOverlay.style.display = 'none';
            }, 100); 
        });
    </script>
